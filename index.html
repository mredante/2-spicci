  { it: "volare sotto il radar", en: "to fly under the radar", hint: "Direct English idiom borrowed into Italian. Sò riuscito a volà sotto il radar suo per 40 anni = I managed to fly under his radar for 40 years", context: "<em>\"Sò riuscito a volà sotto il radar suo per 40 anni e mò sta là che me guarda con occhi da crotalo.\"</em>", tags: ["idiom"] },
  { it: "occhi da crotalo", en: "rattlesnake eyes", hint: "Crotalo = rattlesnake. Occhi da crotalo = cold, predatory reptilian eyes. The way Paturnia looks at Zero now that he's been spotted", context: "<em>\"Sta là che me guarda con occhi da crotalo e corde vocali di seconda mano.\"</em>", tags: ["roman","idiom"] },
  { it: "corde vocali di seconda mano", en: "second-hand vocal cords", hint: "A voice that sounds worn out, used up, like it was bought at a flea market. Paturnia's threatening, raspy, barely-functional voice", context: "<em>\"Me guarda con occhi da crotalo e corde vocali di seconda mano.\"</em>", tags: ["roman","idiom"] },
  { it: "hai fatto i buffi perché pippi", en: "you got into debt because you do drugs", hint: "Pippare = Roman slang for snorting cocaine. Hai fatto i buffi perché pippi = you got into criminal debt because of your drug habit", context: "<em>\"Hai fatto i buffi perché pippi. Che pensi che sei speciale? Pippano tutti a 'sta città.\"</em>", tags: ["roman","slang"] },
  { it: "pippare", en: "to snort cocaine (Roman slang)", hint: "Roman slang — to use cocaine, specifically snorting. Me stavano a mannà dallo psicologo perché non pippavo = they were sending me to therapy because I wasn't using", context: "<em>\"Pippano tutti a 'sta città. Me stavano a mannà dallo psicologo perché non pippavo.\"</em>", tags: ["roman","verb","slang"] },
  { it: "sbracato tutto", en: "blown everything up / destroyed the balance", hint: "Sbracato = ripped open (sbragare). Poi sò arrivati loro e hanno sbracato tutto = then they arrived and tore everything apart. For a situation that was balanced until outside forces wrecked it", context: "<em>\"Stava tutto in equilibrio. Poi sò arrivati loro e hanno sbracato tutto.\"</em>", tags: ["roman","slang","verb"] },
  { it: "tre mosse avanti", en: "three moves ahead", hint: "Chess metaphor — always three steps ahead. Puoi fà i calcoli, mettere in conto gli imprevisti, ma loro stanno sempre tre mosse avanti", context: "<em>\"Puoi fà i calcoli, mettere in conto gli imprevisti, ma loro stanno sempre tre mosse avanti.\"</em>", tags: ["idiom"] },
  { it: "geneticamente programmati per esse voraci", en: "genetically programmed to be voracious", hint: "Children described like xenomorphs — hardwired to consume endlessly. A darkly comic but relatable framing of the financial drain of parenthood", context: "<em>\"Sò geneticamente programmati per esse voraci come gli xenomorfi.\"</em>", tags: ["idiom"] },
  { it: "per un motivo dignitoso", en: "for a dignified reason", hint: "Me vergognavo, Zè. Te li avrei pure chiesti, ma per un motivo dignitoso = I would have asked you, but for a dignified reason. Not a Communion party", context: "<em>\"Te li avrei pure chiesti, però se erano per un motivo dignitoso.\"</em>", tags: ["idiom"] },
  { it: "il debutto in società", en: "a social debut / coming-out party", hint: "Literally a debutante ball. Used sarcastically for a child's First Communion — la grande industria alimentare dell'ostia della domenica", context: "<em>\"Non ti dico un'operazione a cuore aperto, ma manco perché mia figlia fa il debutto in società nella grande industria alimentare dell'ostia della domenica.\"</em>", tags: ["idiom"] },
  { it: "scommesse birichine", en: "naughty / illegal bets", hint: "Birichino = naughty, mischievous. Scommesse birichine = dodgy bets, illegal gambling. Used with mock-innocent euphemism for clearly shady activity", context: "<em>\"Ho certi agganci nel mondo delle scommesse birichine. Era un'occasione irripetibile.\"</em>", tags: ["roman","idiom","slang"] },
  { it: "un'occasione irripetibile", en: "a once-in-a-lifetime opportunity", hint: "Fixed expression — an opportunity that won't come again. Used by people who are about to make a catastrophic financial decision", context: "<em>\"Era un'occasione irripetibile, Zè.\"</em>", tags: ["idiom"] },
  { it: "le dritte", en: "tips / inside information / hot tips", hint: "Dritta = a straight line, but colloquially = a tip-off, insider info. Ci dà le dritte lei = she gives us the tips. From the gambling world but used broadly", context: "<em>\"Sua cugina ha fatto lo stage a Buckingham Palace. Ci dà le dritte lei, ahò.\"</em>", tags: ["slang","noun"] },
  { it: "non farsi mai i cazzi propri", en: "never minding your own business", hint: "Quello allo sportello non se fa mai i cazzi sua = the bank teller never minds his own business. The busybody who intervenes when they shouldn't", context: "<em>\"Quello allo sportello non se fa mai i cazzi sua.\"</em>", tags: ["roman","idiom"] },
  { it: "i Guardiani della Notte", en: "the Watchers on the Wall (Night's Watch)", hint: "Game of Thrones reference used for Bengali convenience store owners who stay open late. The last defenders of civilization when everything else closes", context: "<em>\"Sò tipo i Guardiani della Notte, loro, che quando la città se spegne rimangono come ultima difesa dell'umanità.\"</em>", tags: ["idiom"] },
  { it: "il ristoro per il viandante disperato", en: "refuge for the desperate traveler", hint: "Viandante = wanderer/traveler. The corner store as the last place of comfort for the desperate late-night wanderer with one euro and some dog hair", context: "<em>\"Il presidio dove il viandante disperato può trovare ristoro.\"</em>", tags: ["idiom","noun"] },
  { it: "figure eroiche e crepuscolari", en: "heroic and twilight figures", hint: "Crepuscolare = of the twilight/dusk — fading, melancholy, at the end of an era. Zero's poetic description of the late-night corner store workers", context: "<em>\"Sò figure eroiche e crepuscolari, eh. Sò tipo i Guardiani della Notte.\"</em>", tags: ["idiom"] },
  { it: "rattoppare i buchi", en: "to patch the holes", hint: "Rattoppare = to patch (like a tire or clothing). Rattoppare i buchi = to patch up the financial or structural holes in something barely holding together", context: "<em>\"Ho rattoppato i buchi, ricostruito, puntellato, stava tutto in equilibrio.\"</em>", tags: ["verb","idiom"] },
  { it: "il cormorano ha bevuto dal calice", en: "the cormorant has drunk from the chalice", hint: "Zero's absurdist spy-code for 'she fell for it / she bought the story.' Meaningless phrase used as mock-secret communication", context: "<em>\"Il cormorano ha bevuto dal calice. Ripeto: il cormorano ha bevuto dal calice.\"</em>", tags: ["roman","idiom"] },
  { it: "un rituale che ognuno smazza da solo", en: "a ritual everyone handles alone", hint: "Smazzare = to deal (cards). Smazzare da solo = to handle it alone, to deal your own hand. The private practice of keeping secrets from your partner", context: "<em>\"È un rituale che ognuno smazza da solo. Guarda, io non sò così.\"</em>", tags: ["roman","idiom"] },
  { it: "c'è stato un bello scambio", en: "there was a good exchange", hint: "Zero's delusional spin on a one-sided conversation where he talked about himself the whole time. Io sentivo buone vibrazioni", context: "<em>\"Secondo me c'è stato un bello scambio. Io sentivo buone vibrazioni.\"</em>", tags: ["roman","idiom"] },
  { it: "il Padawan", en: "the Padawan (Star Wars apprentice)", hint: "Armadillo calls Zero a bad Padawan — a learner who can't properly follow his master's teachings. Used for someone who misses the point of lessons they're being given", context: "<em>\"Non è bono a fà il Padawan. D'altronde, è un coglione.\"</em>", tags: ["slang","idiom"] },
  { it: "una bella situazione di merda", en: "a fine mess / a beautiful shit situation", hint: "Oxymoronic expression — bella (beautiful) + merda (shit). Sarcastic: what a lovely mess we're in. Commonly used in Italian to describe a predicament", context: "<em>\"Bella situazione di merda. Lei come sta?\"</em>", tags: ["roman","idiom"] },
  { it: "bella cappottata", en: "really knocked over / a mess", hint: "Cappottata from cappottare (to flip/overturn). Sta bella cappottata = she's really been knocked sideways, turned upside down. Roman intensifier: bella = really/quite", context: "<em>\"Eh, sta bella cappottata.\"</em>", tags: ["roman","slang"] },
  { it: "un equilibrio molto delicato", en: "a very delicate balance", hint: "Un equilibrio delicato = a fragile equilibrium that can be upset by anything. Used for relationships, living situations, anything just barely working", context: "<em>\"'Sta cosa va a turbà un po' un equilibrio molto delicato.\"</em>", tags: ["idiom"] },
  { it: "grande e vaccinata", en: "grown and vaccinated / a capable adult", hint: "Di fronte c'hai una di 40 anni grande e vaccinata = you're dealing with a 40-year-old who's grown up and vaccinated. She can make her own decisions — stop infantilizing her", context: "<em>\"Di fronte c'hai una di 40 anni grande e vaccinata. Non dipende tutto da te.\"</em>", tags: ["roman","idiom"] },
  { it: "l'autodeterminazione", en: "self-determination / autonomous choice", hint: "The philosophical right to make your own choices — even terrible ones. 99 volte su 100 sò immani cazzate che te fanno pentì de esse nato", context: "<em>\"L'autodeterminazione è la capacità di scelta autonoma che gli consente de pijà decisioni che 99 volte su 100 sò immani cazzate.\"</em>", tags: ["noun"] },
  { it: "immane cazzata", en: "a colossal blunder / massive screw-up", hint: "Immane = enormous, monstrous. Una immane cazzata = a mistake of truly epic proportions. Often what you get when you exercise your autodetermination", context: "<em>\"Decisioni che 99 volte su 100 sò immani cazzate che te fanno pentì de esse nato.\"</em>", tags: ["slang","noun"] },
  { it: "pijà due spicci di responsabilità", en: "to take a couple cents' worth of responsibility", hint: "Due spicci di responsabilità = the bare minimum of responsibility. Ma te li vuoi pijà due spicci di responsabilità? = can you take even a tiny bit of ownership here?", context: "<em>\"Ma te li vuoi pijà due spicci di responsabilità?\"</em>", tags: ["roman","idiom"] },
  { it: "con la morte nel cuore", en: "with death in your heart / reluctantly and miserably", hint: "Fixed expression — doing something with great reluctance and sorrow. Una stanza per due giorni con la morte nel cuore non è 'sta grande alternativa", context: "<em>\"Una stanza per due giorni con la morte nel cuore non è proprio 'sta grande alternativa.\"</em>", tags: ["idiom"] },

  // === EP5 DEEP MINE ===
  { it: "un giorno che lo sai che non può andà a finì bene", en: "a day you know can't end well", hint: "Ce stanno certi giorni che lo sai che non ponno annà a finì bene. Lo capisci perché è come se c'avessero una voce petulante e monotona", context: "<em>\"Ce stanno certi giorni che lo sai che non ponno annà a finì bene.\"</em>", tags: ["roman","idiom"] },
  { it: "una voce petulante e monotona", en: "a petulant and monotonous voice", hint: "Petulante = nagging, whiny. The day itself has a petulant nagging voice asking 'but why are we here?' — personifying dread", context: "<em>\"È come se c'avessero una voce petulante e monotona, e sta sempre a fà domande.\"</em>", tags: ["idiom"] },
  { it: "spizzare", en: "to eye someone up / spy on", hint: "Spizzare = to peep, to size someone up with suspicious eyes. Ci spizzavano = they were eyeing us, clocking us. Distinctly Roman surveillance vocabulary", context: "<em>\"Ci spizzavano, ci giravano intorno, ci imbruttivano.\"</em>", tags: ["roman","verb","slang"] },
  { it: "mento alto", en: "chin up / head high", hint: "Literally 'chin high.' Mento alto, alto, e mai contatto visivo = chin high and never make eye contact. How to walk through dangerous territory without provoking anyone", context: "<em>\"Devi stà tranquillo. Mento alto, alto, e mai contatto visivo.\"</em>", tags: ["roman","idiom"] },
  { it: "il bancomat non si brucia", en: "you don't burn the ATM", hint: "Se uno vuole ritirà i soldi, non brucia il bancomat = if someone wants to make a withdrawal, they don't burn the ATM. Why Zero is safer than he thinks", context: "<em>\"Sei il bancomat. Se uno vuole ritirà i soldi, non brucia il bancomat.\"</em>", tags: ["roman","idiom"] },
  { it: "fassi accoltellare da qualcuno che ascolta la trap", en: "getting stabbed by someone who listens to trap music", hint: "These kids are nervous, hands shaking, music chaotic — if they pull a knife it's a mess. Getting stabbed by someone who listens to Lucio Dalla is more dignified", context: "<em>\"Non te fà mai accoltellà da uno che ascolta la trap.\"</em>", tags: ["roman","idiom"] },
  { it: "dritto per dritto", en: "straight in straight out / clean through", hint: "Describes a clean stab: enters and exits without twisting. Entra e esce. Tu-tu. È come un pizzico. Used to grotesquely minimize the danger", context: "<em>\"Te dà una puncicata sulla chiappa. Dritto per dritto, no? Entra e esce. Tu-tu.\"</em>", tags: ["roman","idiom"] },
  { it: "appizzare la macchina", en: "to park the car / ditch the car", hint: "Appizzare = Roman slang for parking or leaving something somewhere. Appizzato la macchina = dumped the car somewhere", context: "<em>\"Poi, appizzato la macchina, se semo fatti un pezzo di strada a piedi.\"</em>", tags: ["roman","verb","slang"] },
  { it: "è precipitato tutto", en: "everything has collapsed / gone off a cliff", hint: "Precipitare = to precipitate/fall rapidly. È precipitato tutto = everything has gone to hell fast. The moment a manageable problem becomes a life-threatening situation", context: "<em>\"È precipitato tutto, mò Paturnia ci vuole ammazzà.\"</em>", tags: ["verb","idiom"] },
  { it: "un frullato di soldi, onore, furia, fregna", en: "a cocktail of money, honor, rage, and sex", hint: "Frullato = blended drink. All the reasons people kill each other blended into one situation — money, pride, anger, and romantic jealousy", context: "<em>\"È diventata un frullato di soldi, onore, Furia, fregna. Tutte le cose per cui la gente si ammazza accorpate in un unico individuo.\"</em>", tags: ["roman","idiom"] },
  { it: "la tana del Bianconiglio", en: "the White Rabbit's den (rabbit hole)", hint: "Alice in Wonderland reference — the secret door behind the restaurant leads to the Oberbunker, like falling down the rabbit hole", context: "<em>\"Ma dietro questa porta ci sta la tana del Bianconiglio.\"</em>", tags: ["idiom"] },
  { it: "il pensiero indolente", en: "the lazy thought / the comfortable idea", hint: "Indolente = lazy, indolent. Il pensiero indolente = the soft, comfortable thought you're not allowed to have. Wanting the workers to start later = sinful bourgeois comfort", context: "<em>\"Non appena formulavo 'sto pensiero indolente, avevo il tribunale del popolo interiore che me processava.\"</em>", tags: ["idiom"] },
  { it: "il tribunale del popolo interiore", en: "the interior people's tribunal", hint: "Zero's inner voice as a Stalinist tribunal that prosecutes any bourgeois thought. The guilt mechanism that prevents him from having normal complaints", context: "<em>\"Avevo il tribunale del popolo interiore che me processava.\"</em>", tags: ["roman","idiom"] },
  { it: "il cavillo", en: "a technicality / legal loophole", hint: "A tiny legal detail that changes everything. Ha scoperto un cavillo assurdo = he discovered a ridiculous technicality — there's a 1966 law abolishing slavery", context: "<em>\"Ha scoperto un cavillo assurdo che non lo sa nessuno — una legge del '66 che abolisce la schiavitù!\"</em>", tags: ["noun"] },
  { it: "a scrocco", en: "for free / freeloading", hint: "Scroccare = to freeload, to get something for nothing. Connettiti a scrocco col Wi-Fi = connect to the Wi-Fi for free (without paying)", context: "<em>\"Te puoi connette a scrocco col Wi-Fi di quello strano al piano di sopra.\"</em>", tags: ["roman","slang"] },
  { it: "non riconducibile a me", en: "not traceable back to me", hint: "Riconducibile = attributable, traceable. Non ce sta niente di riconducibile a me = nothing there can be traced back to me. The Oberbunker's key advantage as a hideout", context: "<em>\"L'Oberbunker segreto, dove nessuno ce può trovà. Perché non ce sta niente di riconducibile a me.\"</em>", tags: ["idiom"] },
  { it: "un essere di pura luce e cotolette panate", en: "a being of pure light and breaded cutlets", hint: "Zero's over-the-top compliment to his mother — she is too pure and innocent (and a good cook) to hear about his plans to use the room for sleeping, not sex", context: "<em>\"Sei un essere di pura luce e cotolette panate!\"</em>", tags: ["roman","idiom"] },
  { it: "pijà una gravidanza isterica", en: "to get a hysterical pregnancy", hint: "Gravidanza isterica = hysterical/phantom pregnancy. Me pija una gravidanza isterica = I'm going to have a breakdown. Hyperbole for desperate need", context: "<em>\"Me basta un buco per dormì, o me pija una gravidanza isterica!\"</em>", tags: ["roman","idiom"] },
  { it: "il conflitto d'interessi", en: "conflict of interest", hint: "Used when Zero wants to tell Smeralda not to go back but realizes his obvious ulterior motive makes his advice untrustworthy — a conflict of interest", context: "<em>\"Te sei bloccato perché, è vero, c'è conflitto d'interessi. A questa je batti i pezzi da 20 anni.\"</em>", tags: ["noun","idiom"] },
  { it: "battere i pezzi a qualcuno", en: "to hit on someone / to be into someone", hint: "Battere i pezzi = to beat the pieces = to try your luck with someone romantically. Crude but common Roman expression for pursuing someone", context: "<em>\"A questa je batti i pezzi da 20 anni, è vero.\"</em>", tags: ["roman","slang","idiom"] },
  { it: "il conflitto d'interessi", en: "conflict of interest", hint: "Used when Zero wants to tell Smeralda not to go back but realizes his obvious ulterior motive makes his advice untrustworthy", context: "<em>\"Te sei bloccato perché c'è conflitto d'interessi.\"</em>", tags: ["noun"] },
  { it: "borsone", en: "a large bag / holdall", hint: "Augmentative of borsa (bag). Il borsone = a big bag, usually a sports or travel bag. Il borsone che me pareva pesantissimo, come se dentro ci stavano tutti gli impicci", context: "<em>\"L'ho guardata, con quel borsone che me pareva pesantissimo, come se dentro ci stavano tutti gli impicci che se portava appresso.\"</em>", tags: ["noun"] },
  { it: "fare il cinema dalla finestra", en: "to make a dramatic scene from the window", hint: "Fare il cinema = to make a dramatic theatrical scene. Ci manco solo io che me metto a faje il cinema dalla finestra = I just need me making a big scene from the window", context: "<em>\"Ci manco solo io che me metto a faje il cinema dalla finestra.\"</em>", tags: ["roman","idiom"] },
  { it: "è uscita dalla mia orbita", en: "she's left my orbit", hint: "Astronomical metaphor — a planet drifting out of orbit. La vedo allontanarsi come un pianeta che esce dalla mia orbita. For losing someone who was part of your world", context: "<em>\"La vedo allontanarsi come un pianeta che esce dalla mia orbita.\"</em>", tags: ["idiom"] },
  { it: "dodecaedro in cui ogni lato è ornato dal sangue", en: "a dodecahedron where every face is decorated in blood", hint: "Zero's geometric insult for Paturnia: not just one violent side but a 12-sided shape where every single face is violent", context: "<em>\"Non ha un lato violento! È un dodecaedro in cui ogni lato è ornato dal sangue e dai denti strappati ai suoi nemici!\"</em>", tags: ["roman","idiom"] },
  { it: "in cima alla catena alimentare", en: "at the top of the food chain", hint: "Con Paturnia sò tutti più deboli! È in cima alla catena alimentare! = With Paturnia everyone is weaker — he's at the top of the food chain", context: "<em>\"Con Paturnia sò tutti più deboli! È in cima alla catena alimentare!\"</em>", tags: ["idiom"] },
  { it: "se sò bevuti il padre", en: "they drank up the father / lost the father to alcohol", hint: "Roman expression: se sò bevuti il padre = they lost the father to drinking. Used for a parent destroyed by alcoholism", context: "<em>\"Se sò bevuti il padre quando era piccolo, la madre ubriacona. Praticamente non ha mai avuto amore.\"</em>", tags: ["roman","idiom"] },

  // === EP6 DEEP MINE ===
  { it: "levare le pile a qualcuno", en: "to remove someone's batteries", hint: "Cinghiale kept repeating himself and Zero wanted to levàje le pile = remove his batteries. The image of a person as a device you want to switch off", context: "<em>\"Je volevo solo levà le pile e dije: 'Già me l'hai detto!'\"</em>", tags: ["roman","idiom"] },
  { it: "fare pat pat sulla spalla", en: "to give a pat on the back (dismissively)", hint: "Pat pat = the gesture of patronizing comfort. Je facevano pat pat sulla spalla = they gave her a sympathetic pat but nothing changed", context: "<em>\"Ci andava a piangere, le facevano pat pat sulla spalla, e poi il giorno dopo lui je rifaceva la faccia come un pallone.\"</em>", tags: ["roman","idiom"] },
  { it: "rifare la faccia come un pallone", en: "to redo someone's face like a balloon", hint: "To beat someone's face until it swells up like a balloon. Graphic Roman expression for a bad beating, delivered with characteristic flatness", context: "<em>\"Il giorno dopo lui je rifaceva la faccia come un pallone.\"</em>", tags: ["roman","idiom"] },
  { it: "a 'sto giro", en: "this time around / this round", hint: "Giro = round/turn. A 'sto giro = this time, on this occasion. A very natural Roman phrase for 'this particular instance'", context: "<em>\"A 'sto giro t'ammazza.\"</em>", tags: ["roman","idiom"] },
  { it: "buttarsi a dormì", en: "to throw yourself to sleep", hint: "Buttarsi = to throw yourself. Buttamose a dormì = let's throw ourselves to sleep. The exhausted surrender to sleep after an impossible day", context: "<em>\"Sò le due di notte. Tanto non venimo a capo di niente qua, buttamose a dormì.\"</em>", tags: ["roman","idiom"] },
  { it: "venire a capo di qualcosa", en: "to get to the bottom of something / make headway", hint: "Venire a capo = to come to the head/end. Non venimo a capo di niente = we're not getting anywhere with this. For a problem that resists all attempts at resolution", context: "<em>\"Tanto non venimo a capo di niente qua, buttamose a dormì.\"</em>", tags: ["idiom"] },
  { it: "la logica implacabile", en: "the implacable logic", hint: "Sarah's reasoning is always airtight. La logica implacabile di 'sta donna me lascia sempre ammirato = the implacable logic of this woman always leaves me in awe", context: "<em>\"La logica implacabile di 'sta donna me lascia sempre ammirato. Chapeau!\"</em>", tags: ["idiom"] },
  { it: "déjà-vu", en: "déjà-vu", hint: "Direct French loanword used in Italian. Mentre se mettemo a dormì, c'ho un déjà-vu — used naturally in Italian conversation without feeling foreign", context: "<em>\"Mentre se mettemo a dormì, c'ho un déjà-vu.\"</em>", tags: [] },
  { it: "i naufraghi de La zattera della Medusa", en: "the castaways from the Raft of the Medusa", hint: "Géricault's famous painting of desperate shipwreck survivors. Zero's friends on the floor = those doomed figures clinging to each other", context: "<em>\"Paremo i naufraghi di quel quadro di coso, là, La zattera della Medusa.\"</em>", tags: ["idiom"] },
  { it: "capoccia d'uovo", en: "egg-head / having a very round bald head", hint: "Coccia d'uovo = egg-shell head. Zero's father's genetics — responsible for his thinning hair. A very Roman way to describe someone with a perfectly round bald head", context: "<em>\"Non sò pelato, se stanno a diradà, ma sò i geni di mio padre coccia d'uovo.\"</em>", tags: ["roman","slang","idiom"] },
  { it: "la sindrome di Tourette", en: "Tourette's syndrome (used hyperbolically)", hint: "Used hyperbolically — Non mi so trattenere. Ho la sindrome di Tourette = I can't help myself. For involuntary blurting of inappropriate things", context: "<em>\"Non mi so trattenere. Ho la sindrome di Tourette. Pelato.\"</em>", tags: ["slang","idiom"] },
  { it: "tutto quello che aveva costruito", en: "everything he had built", hint: "Ha buttato al cesso tutto quello che aveva costruito = he flushed everything he'd built. The accumulated achievements of a life destroyed by bad choices", context: "<em>\"Uno s'è fatto mangià da segreti e impicci. Ha buttato al cesso tutto quello che aveva costruito.\"</em>", tags: ["idiom"] },
  { it: "camminare alla cieca", en: "to walk blind / groping in the dark", hint: "Camminare alla cieca = walking without being able to see. Non lo so do' cazzo annamo, così alla cieca — for a situation with no roadmap and no certainty", context: "<em>\"Non lo so do' cazzo annamo, così alla cieca.\"</em>", tags: ["idiom"] },
  { it: "le misure cautelari", en: "restraining orders / legal restrictions", hint: "L'altra campa con le misure cautelari. Prima di uno spostamento je serve la firma del magistrato = needs a magistrate's signature before moving", context: "<em>\"L'altra campa con le misure cautelari. Prima di uno spostamento je serve la firma del magistrato.\"</em>", tags: ["noun"] },
  { it: "un'anima in pena da tutta la vita", en: "a tormented soul her whole life", hint: "Smeralda's condition — not occasional sadness but a lifetime of being a troubled spirit who can't find peace", context: "<em>\"Smeralda, che è un'anima in pena da tutta la vita.\"</em>", tags: ["idiom"] },
  { it: "fà una cosa asciutta", en: "to do it briefly / cut the sentimentality", hint: "Asciutto = dry/terse. Fare una cosa asciutta = to do something clean and without fuss. Presto mio nonno e famo una cosa più asciutta = use my grandfather for something more to-the-point", context: "<em>\"Oppure te presto mio nonno e famo una cosa più asciutta.\"</em>", tags: ["roman","idiom"] },
  { it: "il carro del disordine", en: "the cart of disorder / the chaos wagon", hint: "Zero's metaphor: there's a moment when the cart of chaos goes out of control and you can only hope it doesn't destroy you when it crashes", context: "<em>\"C'è un momento in cui avverti che il carro del disordine gira fuori controllo.\"</em>", tags: ["roman","idiom"] },
  { it: "scollegare i legami tra un'azione e le sue conseguenze", en: "to disconnect action from consequence", hint: "What Zero must do to press Send on the message to Paturnia — deliberately sever the mental link between what he does and what will happen", context: "<em>\"Devo ordinare al mio cervello di scollegare tutti i legami tra un'azione e le sue conseguenze.\"</em>", tags: ["idiom"] },
  { it: "una bestia incapace di proiettarsi nel futuro", en: "a beast unable to project into the future", hint: "What Zero becomes once he disconnects from consequences. A creature that lives only in the present — like an animal. The cost of doing what needs to be done", context: "<em>\"Divento sempre meno me stesso e somiglio sempre di più a un animale. Una bestia incapace di proiettarsi nel futuro.\"</em>", tags: ["idiom"] },
  { it: "si può trovà un accordo che conveniva a todos", en: "an agreement could be found that suited everyone", hint: "The criminal logic of the deal — it's not personal, it's business. A todos = to everyone (Spanish bleed into Roman criminal slang)", context: "<em>\"Si poteva trovà un accordo che conveniva a todos.\"</em>", tags: ["roman","slang","idiom"] },
  { it: "vecchia scuola", en: "old school", hint: "Loro sò vecchia scuola = they're old school. Bank robbers, not drug dealers. The criminal code of an older generation with its own pride and standards", context: "<em>\"Loro sò vecchia scuola. Il mestiere loro non si fa più, ormai è tutto digitale.\"</em>", tags: ["slang","idiom"] },

  { it: "la ghiandola del sottone", en: "the pushover gland", hint: "Zero's theory: he has a gland that makes him a pushover. Col caldo, mi si era inibita la ghiandola del sottone = the heat had inhibited my pushover gland, allowing him to say no", context: "<em>\"Col caldo, mi si era inibita la ghiandola del sottone.\"</em>", tags: ["roman","idiom"] },
  { it: "il manzo non sta più su piazza", en: "the beef is no longer on the market", hint: "Manzo = beef/stud. Stare su piazza = to be available on the market. 'Sto manzo non sta più su piazza = this piece of meat is no longer available. Crude Roman self-promotion", context: "<em>\"'Sto manzo non sta più su piazza. È ito alla monta a chilometro zero.\"</em>", tags: ["roman","slang","idiom"] },
  { it: "andare alla monta a chilometro zero", en: "gone to stud at zero kilometers", hint: "Monta = stud service (animal breeding). A chilometro zero = locally sourced. Absurd combination: the stud bull who only services local farms. Self-deprecating boast", context: "<em>\"'Sto manzo non sta più su piazza. È ito alla monta a chilometro zero.\"</em>", tags: ["roman","idiom"] },
  { it: "qualcosa di piccolissimo si è scheggiato", en: "something tiny has chipped / cracked", hint: "Scheggiato = chipped (like a glass or ceramic). Me sembrava come se qualcosa di piccolissimo, impercettibile, si fosse scheggiato pure dentro di lei — a barely perceptible internal fracture", context: "<em>\"Me sembrava come se qualcosa di piccolissimo, impercettibile, si fosse scheggiato pure dentro di lei.\"</em>", tags: ["idiom","verb"] },
  { it: "la coccia d'ananas", en: "the pineapple rind (makeshift armor)", hint: "Secco wearing pineapple rind as armor. La coccia = the hard outer shell. If there's fire involved, pineapple rind resists a blowtorch better than anything. Tactical genius", context: "<em>\"È molto meglio l'ananas. La coccia dell'ananas è più dura, e in più ferma il fuoco.\"</em>", tags: ["roman","slang","idiom"] },
  { it: "conta il percepito", en: "perception is what counts", hint: "Conta il percepito = what matters is how it's perceived, not what actually happened. Legal/social concept: even if you didn't sleep with her, if he thinks you did, that's what counts", context: "<em>\"Non ho scopato! Conta il percepito.\"</em>", tags: ["idiom"] },
  { it: "l'azienda a conduzione familiare", en: "the family-run business", hint: "Used sarcastically for Paturnia's criminal organization. L'hanno licenziato dall'azienda a conduzione familiare dove stava = fired from the family business", context: "<em>\"L'hanno licenziato dall'azienda a conduzione familiare dove stava.\"</em>", tags: ["idiom"] },
  { it: "il meteorite che cancella la vita sulla Terra", en: "the meteorite that wipes out life on Earth", hint: "Zero's solution to dying: he wants a meteorite to hit at the exact moment of his death so everyone dies with him and he doesn't have to rosicà that they keep living", context: "<em>\"Vorrei che nell'ultimo battito del mio cuore arriva un meteorite che cancella la vita sulla Terra. Così stiamo tutti pari e non rosico.\"</em>", tags: ["roman","idiom"] },
  { it: "stare tutti pari", en: "to all be even / all square", hint: "Pari = equal. Così stiamo tutti pari e non rosico = so we're all even and I don't have to be bitter. Zero's egalitarian solution to mortality", context: "<em>\"Così stiamo tutti pari e non rosico.\"</em>", tags: ["roman","idiom"] },
  { it: "il gesto internazionale del levamose dar cazzo", en: "the international gesture for 'let's get out of here'", hint: "Carlo's wordless signal that it's time to leave the crime scene immediately. Universal communication transcending language barriers", context: "<em>\"Carlo ha fatto il gesto internazionale del 'levamose dar cazzo'.\"</em>", tags: ["roman","idiom"] },
  { it: "stare mezzo in trance", en: "to be half in a trance", hint: "Io stavo mezzo in trance = I was half in a trance. The dazed mental state after witnessing something shocking that the brain can't fully process", context: "<em>\"Io stavo mezzo in trance, è difficile dire che avevo in testa.\"</em>", tags: ["idiom"] },
  { it: "l'autopsia della propria testa", en: "performing an autopsy on your own head", hint: "Zero's method for regaining control: mentally open your skull, remove each thought, lay them on a table and examine them. Mettere in ordine i pensieri as forensic procedure", context: "<em>\"Devo fà come se fosse un'autopsia. Apro la testa e tiro fuori ogni pensiero e lo metto sul tavolo.\"</em>", tags: ["roman","idiom"] },
  { it: "una busta di piscio", en: "a bag of piss", hint: "Zero's internal reaction to Smeralda grieving for Paturnia. A busta di piscio = a worthless, contemptible person. The internal voice he knows he shouldn't have", context: "<em>\"A me comunque me fa rosicà che piagne per quella busta di piscio.\"</em>", tags: ["roman","slang","noun"] },
  { it: "posso rosicà o devo chiedere il permesso", en: "can I be bitter or do I need permission?", hint: "Zero defending his right to feel bitter — even if his feelings aren't entirely rational. The right to rosicà without having to justify it", context: "<em>\"A me comunque me fa rosicà che piagne per quella busta di piscio. Posso? Posso rosicà o devo chiedere il permesso?\"</em>", tags: ["roman","idiom"] },

  { it: "la vita vera è sempre sciatta come sceneggiatura", en: "real life always has lazy writing", hint: "The anticlimactic reveal: Carlito got Imran involved simply because their kids go to the same school. Reality is always less dramatic than fiction", context: "<em>\"La vita vera è sempre così sciatta, come sceneggiatura. Pigra.\"</em>", tags: ["idiom"] },
  { it: "sciatto", en: "sloppy / lazy / careless", hint: "Sciatto = slovenly, careless, low-quality. Used for bad writing, bad planning, bad execution. La vita è sempre così sciatta come sceneggiatura = life always has such lazy plotting", context: "<em>\"La vita vera è sempre così sciatta, come sceneggiatura. Pigra.\"</em>", tags: [] },
  { it: "si comprano il debito", en: "they buy the debt", hint: "The financial mechanism of the plot resolution — the Coccodritto family buys Cinghiale's debt from the Tartallegra, becoming the new creditors. Debt as commodity", context: "<em>\"Gli ho fatto comprà il debito. Non li devo più ai Tartallegra, ma li devo ai Coccodritto.\"</em>", tags: ["noun","slang"] },

  { it: "tenere il punto", en: "to hold your ground / stand firm", hint: "Hai tenuto il punto con Stella = you held your position with Stella, you didn't go back. Not maintaining a score but maintaining a life decision", context: "<em>\"Però hai tenuto il punto con Stella. Sai che ho perso mezza piotta?\"</em>", tags: ["idiom"] },
  { it: "lo spiraglio", en: "a crack of light / a tiny opening", hint: "Spiraglio = a small gap, a chink of light. Mi ha aperto un piccolo spiraglio = he opened a small crack in which I could see things differently. A moment of unexpected perspective", context: "<em>\"Per un attimo mi ha aperto un piccolo spiraglio in cui ho rivisto gli ultimi anni.\"</em>", tags: ["noun"] },
  { it: "invorticarsi appresso a qualcosa", en: "to spiral into something / get sucked into a vortex", hint: "Vortice = vortex/whirlpool. Invorticarsi = to get caught in a spiral. Mi sò invorticato appresso al lavoro = I got sucked into a vortex of work", context: "<em>\"Ho rivisto gli ultimi anni e tutte le cose in cui mi sò invorticato appresso al lavoro.\"</em>", tags: ["roman","verb"] },
  { it: "würstello di carne per lo più suina", en: "sausage of mostly pork (a child)", hint: "Zero's description of a small child: an innocent little sausage of predominantly pork meat. The way toddlers look from an adult's perspective", context: "<em>\"Forse lui ci guarda, ingenuo würstellino di carne per lo più suina, e ci vede così.\"</em>", tags: ["roman","idiom"] },
  { it: "incrollabile come i capoccioni dell'Isola di Pasqua", en: "unshakeable like the Easter Island heads", hint: "The child sees the adults as enormous immovable monoliths — like Easter Island statues. The illusion children have of adults as stable and certain", context: "<em>\"Ci vede così, incrollabili come i capoccioni dell'Isola di Pasqua.\"</em>", tags: ["idiom"] },
  { it: "chi ha nuotato fino a riva e poi si è strisciato a nascondese nel punto più buio della notte", en: "those who swam to shore then crawled to hide in the darkest point of night", hint: "Zero's final image of the generation — some drowned, some crawled to shore but hide in the dark. Not triumphant survivors but hidden, wounded ones", context: "<em>\"Di quelli che hanno nuotato fino a riva e poi sò strisciati a nascondese nel punto più buio della notte, ai confini dell'universo.\"</em>", tags: ["roman","idiom"] },
  { it: "ai confini dell'universo", en: "at the edges of the universe", hint: "At the very farthest margins — those who've retreated to the outermost edges of the social world. Extreme isolation rendered as cosmological distance", context: "<em>\"Si sò strisciati a nascondese nel punto più buio della notte, ai confini dell'universo.\"</em>", tags: ["idiom"] },
  { it: "un accrocco che si regge con lo sputo e con lo Xanax", en: "a contraption held together with spit and Xanax", hint: "The generation's houses/lives: not made of stone but cobbled together from detritus, held up by spit and anxiety medication. The defining image of ep8", context: "<em>\"Sò di tutta quella monnezza che avemo accumulato negli anni. Tutto un accrocco che si regge con lo sputo e con lo Xanax.\"</em>", tags: ["roman","idiom"] },
  { it: "non so se è normale avecce una lista in testa", en: "I don't know if it's normal to have a list in your head", hint: "Sarah's breakup behavior: keeping a mental list of things to tell Stella when they reunite, updating it daily, as if they're just on a break. Classic post-breakup denial", context: "<em>\"È normale avecce una lista in testa e aggiornarla con tutte le cose che succedono perché penso: 'Così quando la rivedo je posso raccontà tutto.'\"</em>", tags: ["roman","idiom"] },
  { it: "un'app che sta in background", en: "an app running in the background", hint: "The thought of an ex as a background app you can't fully close. Quel pensiero sta sempre là. È come un'app che sta in background pure se non la usi", context: "<em>\"Quel pensiero sta sempre là. È come un'app che sta in background pure se non la usi.\"</em>", tags: ["idiom"] },
  { it: "rialzare la cornetta", en: "to pick up the receiver / reach out", hint: "Cornetta = telephone receiver. Rialzare la cornetta = to make the call, to reach out. The old phone metaphor for breaking no-contact", context: "<em>\"Dipende tutto da me, che se rialzo la cornetta, penso che lei sta là che mi aspetta.\"</em>", tags: ["idiom"] },
  { it: "ogni sera mi guardo allo specchio e mi dico: brava, che pure oggi non ci sei cascata", en: "every evening I look in the mirror and say: well done, you didn't fall for it today", hint: "Sarah's daily ritual — congratulating herself for not contacting Stella. Come una tossica = like an addict. The discipline of maintaining a breakup one day at a time", context: "<em>\"Ogni sera mi guardo allo specchio e mi dico: 'Brava, che pure oggi non ci sei cascata.' Come una tossica.\"</em>", tags: ["roman","idiom"] },
  { it: "Jimmy Caltagirone", en: "Jimmy Caltagirone (ironic name for the Grimm pig)", hint: "Zero's version of the Three Little Pigs — the smart pig who builds in stone is renamed Jimmy Caltagirone, the property developer who exploits the others with the wolf", context: "<em>\"Nella versione dei fratelli Grimm si chiama Jimmy Caltagirone. Un pezzo di merda che butta per strada un vecchio con una casa di palloncini.\"</em>", tags: ["roman","idiom"] },
  { it: "fare stecca con qualcuno", en: "to be in cahoots with / splitting the take", hint: "Stecca = a cut/share. Fare stecca para = to split evenly. Jimmy and the wolf fanno stecca para = they split the profits together. Criminal partnership metaphor", context: "<em>\"Je fa pesà che si sò magnati i soldi della mamma, poi je vende le case e col lupo fanno stecca para.\"</em>", tags: ["roman","slang","idiom"] },

// State
let mode = 'flashcard';
let filter = 'all';
let deck = [];
let currentIdx = 0;
let isFlipped = false;
let rights = 0;
let wrongs = 0;
let wrongCards = [];

function getFilteredDeck() {
  if (filter === 'all') return [...VOCAB];
  if (filter === 'weak') return VOCAB.filter(v => wrongCards.some(w => w.it === v.it));
  return VOCAB.filter(v => v.tags.includes(filter));
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach((b, i) => {
    b.classList.toggle('active', ['flashcard','browse'][i] === m);
  });
  document.getElementById('flashcardView').classList.toggle('hidden', m !== 'flashcard');
  document.getElementById('completeScreen').classList.toggle('hidden', true);
  document.getElementById('browseView').classList.toggle('hidden', m !== 'browse');
  document.getElementById('progressWrap').classList.toggle('hidden', m !== 'flashcard');
  document.getElementById('resultsBar').classList.toggle('hidden', m !== 'flashcard');
  document.getElementById('filterBar').classList.remove('hidden');

  if (m === 'browse') renderBrowse();
  if (m === 'flashcard') startDeck();
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (mode === 'flashcard') startDeck();
  else renderBrowse();
}

function startDeck() {
  deck = shuffle(getFilteredDeck());
  currentIdx = 0;
  rights = 0;
  wrongs = 0;
  isFlipped = false;
  document.getElementById('completeScreen').classList.add('hidden');
  document.getElementById('flashcardView').classList.remove('hidden');
  updateCard();
  updateProgress();
  updateResults();
}

function updateCard() {
  if (currentIdx >= deck.length) { showComplete(); return; }
  const card = deck[currentIdx];
  isFlipped = false;
  document.getElementById('cardFront').classList.remove('hidden-face');
  document.getElementById('cardBack').classList.add('hidden-face');
  document.getElementById('wrongBtn').disabled = true;
  document.getElementById('rightBtn').disabled = true;

  // Front: Italian
  document.getElementById('frontLang').textContent = 'ITALIAN';
  document.getElementById('frontWord').textContent = card.it;

  // Back: English
  document.getElementById('backWord').textContent = card.en;
  document.getElementById('backHint').textContent = card.hint || '';
  const ctx = document.getElementById('backContext');
  if (card.context) {
    ctx.innerHTML = card.context;
    ctx.classList.remove('hidden');
  } else {
    ctx.innerHTML = '';
    ctx.classList.add('hidden');
  }
}

function flipCard() {
  const front = document.getElementById('cardFront');
  const back = document.getElementById('cardBack');
  const showingFront = !front.classList.contains('hidden-face');
  if (showingFront) {
    isFlipped = true;
    front.classList.add('hidden-face');
    back.classList.remove('hidden-face');
    document.getElementById('wrongBtn').disabled = false;
    document.getElementById('rightBtn').disabled = false;
  } else {
    front.classList.remove('hidden-face');
    back.classList.add('hidden-face');
  }
}

function markCard(correct) {
  const card = deck[currentIdx];
  if (correct) {
    rights++;
    wrongCards = wrongCards.filter(w => w.it !== card.it);
  } else {
    wrongs++;
    if (!wrongCards.some(w => w.it === card.it)) wrongCards.push(card);
  }
  currentIdx++;
  updateProgress();
  updateResults();
  updateCard();
}

function updateProgress() {
  const total = deck.length;
  const done = currentIdx;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progressLabel').textContent = `Card ${Math.min(done + 1, total)} of ${total}`;
  document.getElementById('progressPct').textContent = `${pct}%`;
  document.getElementById('progressFill').style.width = `${pct}%`;
}

function updateResults() {
  document.getElementById('rightCount').textContent = `${rights} got it`;
  document.getElementById('wrongCount').textContent = `${wrongs} missed`;
}

function showComplete() {
  document.getElementById('flashcardView').classList.add('hidden');
  document.getElementById('completeScreen').classList.remove('hidden');
  document.getElementById('filterBar').classList.add('hidden');
  const total = rights + wrongs;
  const pct = total ? Math.round((rights / total) * 100) : 0;
  document.getElementById('scoreDisplay').textContent = `${pct}%`;
  const msgs = [
    [90, "Zerocalcare himself would be impressed."],
    [70, "Solid — keep drilling the misses."],
    [50, "Getting there. Roman dialect takes time."],
    [0, "These words are slippery. Keep going."]
  ];
  const msg = msgs.find(([thresh]) => pct >= thresh)?.[1] || msgs[3][1];
  document.getElementById('scoreMsg').textContent = `${rights} of ${total} cards · ${msg}`;
  const weakBtn = document.querySelector('.restart-btn:last-child');
  weakBtn.style.display = wrongCards.length ? '' : 'none';
}

function restartDeck() {
  document.getElementById('filterBar').classList.remove('hidden');
  startDeck();
}

function restartWeak() {
  filter = 'weak';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('filterBar').classList.remove('hidden');
  startDeck();
}

function renderBrowse() {
  const filtered = getFilteredDeck();
  const grid = document.getElementById('browseGrid');
  grid.innerHTML = filtered.map(card => `
    <div class="browse-card">
      <div class="browse-it">${card.it}</div>
      <div class="browse-en">${card.en}</div>
      <div class="browse-tags">
        ${card.tags.map(t => `<span class="tag ${t}">${t}</span>`).join('')}
      </div>
    </div>
  `).join('');
}

// Init
startDeck();
</script>
</body>
</html>
