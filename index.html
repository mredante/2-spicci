<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Due Spicci — Flashcards</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap');

  :root {
    --bg: #0e0e0e;
    --surface: #181818;
    --surface2: #222222;
    --border: #2a2a2a;
    --accent: #c8f045;
    --accent2: #ff5c3a;
    --text: #f0ede6;
    --text-dim: #888;
    --text-dimmer: #555;
    --roman: #c8a95a;
    --card-bg: #161616;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 28px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.4rem;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  header span {
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .tag-roman {
    font-size: 0.65rem;
    background: var(--roman);
    color: #000;
    padding: 2px 7px;
    border-radius: 20px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* MODES */
  .mode-bar {
    display: flex;
    gap: 6px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
  }

  .mode-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.78rem;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }

  .mode-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: 600;
  }

  .mode-btn:hover:not(.active) {
    border-color: var(--text-dim);
    color: var(--text);
  }

  /* PROGRESS */
  .progress-bar-wrap {
    padding: 0 28px;
    margin: 16px 0 0;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-bottom: 8px;
    letter-spacing: 0.04em;
  }

  .progress-track {
    height: 3px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* MAIN AREA */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px 20px;
  }

  /* FLASHCARD */
  .card-area {
    width: 100%;
    max-width: 560px;
    margin-bottom: 20px;
  }

  .card-inner {
    width: 100%;
    cursor: pointer;
  }

  .card-face {
    width: 100%;
    min-height: 300px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 28px;
    gap: 12px;
  }

  .card-face.back {
    background: var(--surface);
  }

  .card-face.hidden-face {
    display: none;
  }

  .card-lang {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dimmer);
    font-weight: 500;
  }

  .card-word {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 700;
    text-align: center;
    line-height: 1.2;
    color: var(--text);
  }

  .card-face.back .card-word {
    font-size: clamp(1.3rem, 4vw, 1.9rem);
  }

  .card-hint {
    font-size: 0.78rem;
    color: var(--text-dim);
    font-style: italic;
    text-align: center;
    line-height: 1.5;
  }

  .card-context {
    font-size: 0.72rem;
    color: var(--text-dimmer);
    text-align: center;
    line-height: 1.6;
    border-top: 1px solid var(--border);
    padding-top: 14px;
    width: 100%;
  }

  .card-context em {
    color: var(--roman);
    font-style: normal;
  }

  .card-tap-hint {
    font-size: 0.65rem;
    color: var(--text-dimmer);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 8px;
  }

  /* CONTROLS */
  .card-controls {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 560px;
    margin-bottom: 16px;
  }

  .ctrl-btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }

  .ctrl-btn.wrong {
    background: #2a1a18;
    color: var(--accent2);
    border: 1px solid #3d2320;
  }

  .ctrl-btn.wrong:hover { background: #3d2320; }

  .ctrl-btn.right {
    background: #1a2a12;
    color: var(--accent);
    border: 1px solid #253d18;
  }

  .ctrl-btn.right:hover { background: #253d18; }

  .ctrl-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }

  /* FILTER BAR */
  .filter-bar {
    display: flex;
    gap: 6px;
    padding: 0 28px 14px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.72rem;
    padding: 4px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn.active {
    background: var(--surface2);
    color: var(--text);
    border-color: var(--text-dimmer);
  }

  .filter-btn:hover:not(.active) { border-color: var(--text-dimmer); }

  /* RESULTS PANEL */
  .results-bar {
    display: flex;
    gap: 20px;
    padding: 0 28px 16px;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .results-bar .stat { display: flex; align-items: center; gap: 5px; }
  .results-bar .dot { width: 7px; height: 7px; border-radius: 50%; }
  .results-bar .dot.green { background: var(--accent); }
  .results-bar .dot.red { background: var(--accent2); }

  /* BROWSE MODE */
  .browse-grid {
    width: 100%;
    max-width: 760px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
    padding: 4px 0;
  }

  .browse-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .browse-card:hover { border-color: var(--text-dimmer); }

  .browse-it {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 5px;
  }

  .browse-en {
    font-size: 0.78rem;
    color: var(--text-dim);
    line-height: 1.4;
  }

  .browse-tags {
    display: flex;
    gap: 5px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 0.6rem;
    padding: 2px 7px;
    border-radius: 20px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .tag.roman { background: rgba(200,169,90,0.15); color: var(--roman); }
  .tag.verb { background: rgba(200,240,69,0.1); color: var(--accent); }
  .tag.idiom { background: rgba(255,92,58,0.1); color: var(--accent2); }
  .tag.noun { background: rgba(120,120,255,0.1); color: #a0a0ff; }
  .tag.slang { background: rgba(180,120,220,0.1); color: #c8a0e0; }

  /* COMPLETE SCREEN */
  .complete-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 40px 20px;
    text-align: center;
    max-width: 400px;
    margin: 0 auto;
  }

  .complete-screen h2 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-style: italic;
  }

  .complete-screen p { color: var(--text-dim); font-size: 0.88rem; line-height: 1.6; }

  .score-display {
    font-size: 3rem;
    font-weight: 700;
    color: var(--accent);
  }

  .restart-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 14px 32px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: opacity 0.15s;
  }

  .restart-btn:hover { opacity: 0.85; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>Due Spicci</h1>
  <span>Vocab Flashcards</span>
</header>

<div class="mode-bar">
  <button class="mode-btn active" onclick="setMode('flashcard')">Flashcards</button>
  <button class="mode-btn" onclick="setMode('browse')">Browse All</button>
</div>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" onclick="setFilter('roman', this)">Roman dialect</button>
  <button class="filter-btn" onclick="setFilter('verb', this)">Verbs</button>
  <button class="filter-btn" onclick="setFilter('idiom', this)">Idioms</button>
  <button class="filter-btn" onclick="setFilter('noun', this)">Nouns</button>
  <button class="filter-btn" onclick="setFilter('slang', this)">Slang</button>
  <button class="filter-btn" onclick="setFilter('weak', this)">⚠ Weak</button>
</div>

<div class="progress-bar-wrap" id="progressWrap">
  <div class="progress-meta">
    <span id="progressLabel">Card 1 of 40</span>
    <span id="progressPct">0%</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>

<div class="results-bar" id="resultsBar">
  <div class="stat"><div class="dot green"></div><span id="rightCount">0 got it</span></div>
  <div class="stat"><div class="dot red"></div><span id="wrongCount">0 missed</span></div>
</div>

<main id="mainArea">

  <!-- FLASHCARD VIEW -->
  <div id="flashcardView">
    <div class="card-area">
      <div class="card-inner" id="cardInner" onclick="flipCard()">
        <div class="card-face front" id="cardFront">
          <div class="card-lang" id="frontLang">ITALIAN</div>
          <div class="card-word" id="frontWord">—</div>
          <div class="card-tap-hint">tap to reveal · tap again to flip back</div>
        </div>
        <div class="card-face back hidden-face" id="cardBack">
          <div class="card-lang">ENGLISH</div>
          <div class="card-word" id="backWord">—</div>
          <div class="card-hint" id="backHint"></div>
          <div class="card-context" id="backContext"></div>
        </div>
      </div>
    </div>

    <div class="card-controls" id="cardControls">
      <button class="ctrl-btn wrong" id="wrongBtn" onclick="markCard(false)" disabled>✗ Missed it</button>
      <button class="ctrl-btn right" id="rightBtn" onclick="markCard(true)" disabled>✓ Got it</button>
    </div>
  </div>

  <!-- COMPLETE SCREEN -->
  <div id="completeScreen" class="hidden complete-screen">
    <div style="font-size:2.5rem">🎉</div>
    <h2>Round complete!</h2>
    <div class="score-display" id="scoreDisplay">—</div>
    <p id="scoreMsg"></p>
    <button class="restart-btn" onclick="restartDeck()">Go again</button>
    <button class="restart-btn" style="background:var(--surface2);color:var(--text)" onclick="restartWeak()">Only missed cards</button>
  </div>

  <!-- BROWSE VIEW -->
  <div id="browseView" class="hidden">
    <div class="browse-grid" id="browseGrid"></div>
  </div>

</main>

<script>
const VOCAB = [
  // === STUDIED IN SESSION ===
  { it: "staccà la capoccia", en: "switch your brain off / unplug", hint: "Roman for 'staccare la testa' — give your head a rest, stop overthinking", context: "<em>\"Però deve staccà la capoccia, deve stà tranquilla.\"</em>", tags: ["roman","idiom"] },
  { it: "i buffi", en: "dangerous/criminal debts", hint: "Roman slang — money owed to shady people, not just ordinary debt", context: "<em>\"Non je parlà di buffi, di minacce, Tartallegra.\"</em>", tags: ["roman","slang","noun"] },
  { it: "omertoso", en: "one who keeps a code of silence", hint: "From omertà — the Mafia vow of silence. Used here humorously about keeping a secret", context: "<em>\"Sò omertoso come le tre scimmie di Mosè.\"</em>", tags: ["slang","noun"] },
  { it: "bocca di ciabatta", en: "can't keep a secret / big mouth", hint: "Literally 'ciabatta mouth' — the wide open shape of the bread as a mouth that won't stay shut", context: "<em>\"Ma fosse vero poi, con 'sta bocca di ciabatta.\"</em>", tags: ["roman","idiom"] },
  { it: "il beccamorto", en: "undertaker / gravedigger", hint: "Literally 'corpse pecker' — an old, vivid word for an undertaker", context: "<em>\"Alle cinque vestito da beccamorto.\"</em>", tags: ["noun"] },
  { it: "lanciare il cuore oltre l'ostacolo", en: "to take a leap of faith", hint: "Literally 'throw your heart over the obstacle' — committing before you know if you'll succeed", context: "<em>\"E lancià il cuore oltre l'ostacolo.\"</em>", tags: ["idiom"] },
  { it: "la truffa dello specchietto", en: "the wing mirror scam", hint: "Classic Italian street con — someone claims you knocked off their mirror and demands cash", context: "<em>\"Ho menato a due che mi volevano fà la truffa dello specchietto.\"</em>", tags: ["idiom","noun"] },
  { it: "l'attenuante", en: "mitigating circumstance", hint: "Legal term used ironically in everyday speech — 'the only excuse I'd accept'", context: "<em>\"C'avevi un'attenuante.\"</em>", tags: ["noun"] },
  { it: "accannare", en: "to drop it / to obsess like a dog", hint: "Roman dialect from cane (dog) — either to go at something obsessively OR to drop it", context: "<em>\"E dai, accanna!\"</em>", tags: ["roman","verb"] },
  { it: "il socio", en: "partner / mate / associate", hint: "Formal: business partner. Colloquial: mate, pal. 'Aho socio!' = hey man!", context: "<em>\"Come si chiama il socio del facocero?\"</em>", tags: ["slang","noun"] },
  { it: "il facocero", en: "warthog", hint: "As in Pumba from The Lion King — used as a nickname in the show", context: "<em>\"Il socio del facocero\"</em>", tags: ["noun"] },
  { it: "accollarsi", en: "to burden oneself with / to saddle yourself with", hint: "From collo (neck) — putting something around your neck. Used for relationships, problems, anything you choose to carry", context: "<em>\"Quando se semo accollati 'sta pratica.\"</em>", tags: ["verb"] },
  { it: "la scintilla", en: "spark", hint: "Literal (electrical spark) and figurative (spark of an idea, spark between people). Far scattare una scintilla = to trigger a spark", context: "<em>\"Je fa scattà una scintilla.\"</em>", tags: ["noun"] },
  { it: "le pozze di fango", en: "mud puddles / low moments", hint: "Literally mud pools — used figuratively for the lowest, dirtiest moments of your life", context: "<em>\"Le pozze di fango in cui ho strisciato.\"</em>", tags: ["idiom","noun"] },
  { it: "strisciare", en: "to crawl / to slither", hint: "Like a snake or worm along the ground — more degrading than just 'crawl'", context: "<em>\"Le pozze di fango in cui ho strisciato.\"</em>", tags: ["verb"] },
  { it: "l'erede", en: "heir / offspring (ironic)", hint: "Formally: someone who inherits. Colloquially and sarcastically: your kid, your little heir to the throne", context: "<em>\"Sò contento che l'erede tuo te mena.\"</em>", tags: ["noun"] },
  { it: "la voragine", en: "chasm / sinkhole / emotional void", hint: "Geologically a sinkhole; figuratively an emotional black hole that swallows everything", context: "<em>\"Di voragini emotive.\"</em>", tags: ["noun"] },
  { it: "schiaffeggiare", en: "to slap", hint: "From schiaffo (a slap). Prendere a schiaffi = to slap someone repeatedly", context: "<em>\"Perché gli dèi me devono schiaffeggià così?\"</em>", tags: ["verb"] },
  { it: "fare il botto con l'assicurazione", en: "to commit insurance fraud", hint: "Fare il botto = to make a bang/big splash. Here: staging a fake accident to collect insurance money", context: "<em>\"Non mi è servito fà il botto con l'assicurazione.\"</em>", tags: ["idiom"] },
  { it: "impuntarsi", en: "to dig your heels in", hint: "From punto (stitch/point) — like a needle catching on fabric. Stubborn refusal to budge", context: "<em>\"Me impuntavo per faje vedé i film che dicevo io.\"</em>", tags: ["verb"] },
  { it: "rosicava", en: "he/she was seething / stewing", hint: "From rosicare (to gnaw) — chewing on something bitterly. 'Che rosica!' = he's so bitter!", context: "<em>\"Ma rosicava sempre che me impuntavo.\"</em>", tags: ["verb","slang"] },
  { it: "abbioccarsi", en: "to suddenly nod off / conk out", hint: "That specific heavy drowsiness after a meal or on the sofa. No precise English equivalent", context: "<em>\"Ma poi me abbioccavo subito.\"</em>", tags: ["verb"] },
  { it: "me se acciacca la vena", en: "when I get angry (lit: a vein gets crushed)", hint: "Acciaccare = to bruise/press. The vein that gets compressed = the pressure of rage building", context: "<em>\"Quando me se acciacca la vena, io non la sento la paura.\"</em>", tags: ["roman","idiom"] },
  { it: "stare sul pezzo", en: "to stay focused / stay on top of it", hint: "From journalism — staying on a story. Widely used: stay focused, keep your head in the game", context: "<em>\"Mò me devi stà sul pezzo.\"</em>", tags: ["idiom"] },
  { it: "ammaliata", en: "bewitched / under a spell", hint: "From malia (a spell/charm) — more than just attracted, actually enchanted", context: "<em>\"Ammaliata da qualche gesto efferrato da parte del coatto di turno.\"</em>", tags: ["verb"] },
  { it: "il coatto", en: "Roman street tough / lout", hint: "A specific Roman archetype — working class, loud, tracksuits and gold chains. Il coatto di turno = whichever one happens to be around", context: "<em>\"Il coatto di turno.\"</em>", tags: ["roman","slang","noun"] },
  { it: "baccagliare", en: "to pester / nag / hassle", hint: "Pure Roman dialect — relentless annoying pecking. Like a bird that won't stop squawking at you", context: "<em>\"Che cazzo me vieni a baccaglià?\"</em>", tags: ["roman","verb"] },
  { it: "je parte la brocca", en: "they lose their mind / snap", hint: "Literally 'the jug departs' — la brocca = head in Roman slang. The head just launches away from reason", context: "<em>\"Poi je parte la brocca e fanno qualche cazzata.\"</em>", tags: ["roman","idiom"] },
  { it: "sbragato", en: "torn open / disheveled / sprawled", hint: "From braghe (trousers) — split seam, everything hanging loose. A face full of cuts or someone slovenly on a sofa", context: "<em>\"Sempre tutto sbragato, aperto, pieno di sfregi.\"</em>", tags: ["roman","slang"] },
  { it: "la lamata", en: "a slash with a blade", hint: "From lama (blade). Dare una lamata = to slash someone. Direct Roman street vocabulary", context: "<em>\"È la volta buona che te do una lamata.\"</em>", tags: ["roman","slang","noun"] },
  { it: "la botola", en: "trapdoor / hatch", hint: "Literally a trapdoor in the floor. In the show: the hidden compartment inside a person where all their dark stuff is stored", context: "<em>\"Si accorgerà che c'è la botola.\"</em>", tags: ["noun","idiom"] },
  { it: "stava in fissa", en: "was obsessed / fixated", hint: "Avere una fissa = to have a fixation. Widely used across Italy, not just Roman dialect", context: "<em>\"Lo sai che stava in fissa.\"</em>", tags: ["slang","idiom"] },
  { it: "sgobbarselo", en: "to do someone in / off them (slang)", hint: "From sgobbare (to grind/slog). Sgobbarsi qualcuno = to get rid of someone, take them out. Roman slang repurposing an innocent word", context: "<em>\"Se lo sgobbano, a signò!\"</em>", tags: ["roman","verb","slang"] },
  { it: "vacillare", en: "to waver / wobble / falter", hint: "Like a candle flame wobbling. Don't lose your nerve. Non vacillare = don't waver", context: "<em>\"Non me vacillà, che è la volta buona che te do una lamata.\"</em>", tags: ["verb"] },
  { it: "lo sfregio", en: "a scar / slash mark / mark of dishonor", hint: "A slash, a scar — especially one that marks dishonor. Sfregiare = to scar someone. Loaded word in Roman street culture", context: "<em>\"Almeno uno sfregio gliel'ho fatto.\"</em>", tags: ["noun","slang"] },

  // === FROM TRANSCRIPTS — ADDITIONAL ===
  { it: "inghiottire", en: "to swallow / be swallowed", hint: "Literal (swallow food) and figurative (swallowed by darkness, debt, chaos). Stava venendo inghiottita = was being swallowed", context: "<em>\"Stava venendo inghiottita dall'abisso.\"</em>", tags: ["verb"] },
  { it: "l'abisso", en: "the abyss", hint: "The depths, the void. Dall'abisso = by the abyss. Zerocalcare uses it for emotional and social collapse", context: "<em>\"Stava venendo inghiottita dall'abisso.\"</em>", tags: ["noun"] },
  { it: "fracico", en: "rotten / soaking / waterlogged", hint: "Something completely sodden and falling apart — a rotten plank of wood, drenched clothes", context: "<em>\"Un pezzo di legno fracico.\"</em>", tags: ["slang"] },
  { it: "la zattera", en: "the raft", hint: "As in the Titanic floating plank scene — Zero imagining kicking DiCaprio off his raft", context: "<em>\"Se volevano rubà la zattera tua.\"</em>", tags: ["noun"] },
  { it: "il pizzo", en: "protection money / nest egg", hint: "Two meanings: Mafia protection money AND a small personal savings stash. The criminal undertone always hovers", context: "<em>\"Ha messo due soldi al pizzo.\"</em>", tags: ["slang","noun"] },
  { it: "battere cassa", en: "to show up demanding money", hint: "Literally 'bang on the cash register.' Venire a battere cassa = come around collecting", context: "<em>\"Chi ha detto alla gente che potevano venì a batte cassa qua.\"</em>", tags: ["idiom"] },
  { it: "allo sbando", en: "adrift / rudderless", hint: "Without direction, completely lost. Lo sbando = the drifting state. Used for a generation without stability", context: "<em>\"Eravamo i trentenni del nuovo millennio, allo sbando senza un punto fermo.\"</em>", tags: ["idiom"] },
  { it: "mò", en: "now (Roman for adesso)", hint: "Pure Roman dialect — one of the most Roman words there is. Mò che fai? = what are you doing now?", context: "<em>\"Mò me devi stà sul pezzo.\"</em>", tags: ["roman"] },
  { it: "ammazza", en: "wow / damn / bloody hell", hint: "Roman exclamation — literally 'it kills.' Completely versatile, used for surprise, admiration, horror", context: "<em>\"Ammazza! E je sta bene?\"</em>", tags: ["roman","slang"] },
  { it: "manco", en: "not even (Roman for neanche)", hint: "Super common colloquial substitute for neanche/nemmeno. Manco per sogno = not even in your dreams", context: "<em>\"Non mi è servito manco fà il botto.\"</em>", tags: ["roman"] },
  { it: "che c'entra?", en: "what does that have to do with it?", hint: "From c'entrare (to be relevant/connected). One of the most useful colloquial expressions — dismissing an irrelevant point", context: "<em>\"Ma che c'entra? Stava in fissa vent'anni fa.\"</em>", tags: ["idiom"] },
  { it: "è la volta buona", en: "this time it'll really happen", hint: "Fixed expression — 'this is the good time / this time I really mean it.' Can be a genuine warning or sarcastic", context: "<em>\"È la volta buona che te do una lamata.\"</em>", tags: ["idiom"] },
  { it: "mortacci tua", en: "Roman curse (roughly: damn you)", hint: "From morti (dead) — literally cursing someone's dead relatives. Extremely Roman, used as general strong exclamation, not always hostile", context: "<em>\"Mortacci tua, lo facevi pure vent'anni fa.\"</em>", tags: ["roman","slang"] },
  { it: "vabbè", en: "whatever / fine / alright then", hint: "Contraction of va bene — used to concede a point, accept a situation, or brush something off", context: "<em>\"Con aggravante zoofila, ma vabbè.\"</em>", tags: ["roman","slang"] },
  { it: "efferrato", en: "heinous / savage / brutal", hint: "Usually for crimes — un delitto efferato. Zerocalcare uses it sarcastically for stupid macho gestures", context: "<em>\"Ammaliata da qualche gesto efferrato da parte del coatto di turno.\"</em>", tags: ["slang"] },
  { it: "trangugiare", en: "to wolf down / gulp", hint: "Greedy, rapid swallowing. Cento barattoli di Nutella trangugiati piangendo — wolfed down while crying", context: "<em>\"Barattoli di Nutella trangugiati piangendo.\"</em>", tags: ["verb"] },
  { it: "spalmato", en: "spread / smeared", hint: "From spalmare (to spread like butter). Used for anything spread across a surface — honey, plaster, someone on a car bonnet", context: "<em>\"Spalmato di miele e sale grosso.\"</em>", tags: ["verb"] },
  { it: "il setto nasale", en: "the nasal septum", hint: "The cartilage between your nostrils — memorably introduced when an ashtray rearranged Zero's", context: "<em>\"Mi ha rincalcato tutto il setto nasale.\"</em>", tags: ["noun"] },
  { it: "rincalcare", en: "to ram in / press down / pack down", hint: "You rincalci soil around a plant, tobacco in a pipe — or an ashtray into someone's nose", context: "<em>\"Mi ha rincalcato tutto il setto nasale.\"</em>", tags: ["verb"] },
  { it: "le notti in bianco", en: "sleepless nights", hint: "Notte in bianco = white/blank night — a night where you don't sleep at all. Very common Italian expression", context: "<em>\"Notti in bianco, e sulla faccia i segni del cuscino.\"</em>", tags: ["idiom"] },
  { it: "cupo", en: "gloomy / dark / brooding", hint: "Atmosphere, tone, personality — cupo covers all of it. Un film cupo = a dark film. Cupo, angoscioso e mortifero", context: "<em>\"Cupo, angoscioso e mortifero.\"</em>", tags: ["slang"] },
  { it: "angoscioso", en: "anguishing / distressing", hint: "From angoscia (anguish, dread). That particular heavy anxiety — not just sadness but existential dread", context: "<em>\"Cupo, angoscioso e mortifero.\"</em>", tags: [] },
  { it: "districare", en: "to untangle / disentangle", hint: "To work through a tangle — a thread, a problem, a complicated situation. Spesi a districare un filo", context: "<em>\"Anni, mesi, giorni spesi a districare un filo.\"</em>", tags: ["verb"] },
  { it: "l'amore di salvataggio", en: "rescue love / survival love", hint: "Zerocalcare's concept: falling for someone in a terrible situation just to have a reason to keep going", context: "<em>\"Era un amore di salvataggio.\"</em>", tags: ["idiom","noun"] },
  { it: "il punto fermo", en: "a fixed point / anchor / certainty", hint: "Literally a firm/fixed point — something stable to hold onto. Senza un punto fermo = with nothing solid to stand on", context: "<em>\"Allo sbando senza un punto fermo.\"</em>", tags: ["idiom","noun"] },
  { it: "regazzino / regà", en: "kid / guys (Roman for ragazzo / ragazzi)", hint: "Roman dialect pronunciation — the -g- softens. Regà is the vocative plural: hey guys", context: "<em>\"Regà, è lei.\"</em>", tags: ["roman"] },

  // === EP 1-2 ===
  { it: "il lag", en: "the gap between reality and what you claim", hint: "Zero's concept: the time between what's actually happening and what you tell someone. 'La zona d'ombra dei cazzari' — the liar's blind spot", context: "<em>\"Semo portà avanti coi messaggi e poi lavorà per riduce il lag fra il vissuto e il dichiarato.\"</em>", tags: ["slang","noun"] },
  { it: "arrembare", en: "to board / go on the offensive", hint: "From naval boarding — like a pirate ship. Devi arrembare = you have to go on the offensive, stop playing defense", context: "<em>\"Non giocà in difesa. Arremba, arremba! Devi arrembare.\"</em>", tags: ["verb","slang"] },
  { it: "spregiudicato", en: "bold / unscrupulous / no-holds-barred", hint: "Someone who doesn't let moral scruples stop them. Devi esse spregiudicato = you have to be bold, throw out the rulebook", context: "<em>\"Devi esse spregiudicato, non giocà in difesa.\"</em>", tags: [] },
  { it: "fà una figura di merda", en: "to embarrass yourself / look like an idiot", hint: "Literally 'make a shit figure' — making a terrible impression in front of others", context: "<em>\"Ciao, va' a fà 'sta figura di merda.\"</em>", tags: ["roman","idiom"] },
  { it: "sbajà", en: "to make a mistake (Roman for sbagliare)", hint: "Roman dialect — the -gl- softens. M'ero sbajato = I was wrong. Very common in spoken Roman", context: "<em>\"Ah Zè, ma come te fai a sbajà? È il locale tuo!\"</em>", tags: ["roman","verb"] },
  { it: "uno sbandato", en: "a drifter / someone unmoored", hint: "From sbandare (to veer off). No fixed point, no stability. Cioè, non sò uno sbandato? Sì, ma senza buffi", context: "<em>\"Conoscemo solo scimmie urlatrici piene di buffi. Non sò uno sbandato? Sì, ma senza buffi.\"</em>", tags: ["slang","noun"] },
  { it: "la piazzola in testa", en: "a bald patch / landing pad", hint: "Piazzola = a small plaza. A little piazza on your head = a bald spot. Ho una piazzola in testa che ce atterra un drone", context: "<em>\"Sò passati cinque anni, ho una piazzola in testa che ce atterra un drone.\"</em>", tags: ["roman","idiom"] },
  { it: "la cecità psichica", en: "psychic blindness", hint: "Zero's self-diagnosis: he literally cannot see things that might be an accollo. His brain filters them out automatically", context: "<em>\"Mi è venuta una cecità psichica per le cose che ponno esse un accollo. Non le vedo proprio.\"</em>", tags: ["idiom","noun"] },
  { it: "il sottone", en: "a pushover / people-pleaser", hint: "Someone who can never say no. Io sò un sottone = I'm a total pushover. Very colloquial and widely used among younger Italians", context: "<em>\"Sò un sottone, non dico di no manco a quelli che mi vendono enciclopedie.\"</em>", tags: ["slang","noun"] },
  { it: "puntellare", en: "to prop up / shore up", hint: "From puntello (a support beam). To shore something up structurally. Used for keeping a precarious situation from collapsing", context: "<em>\"Ho rattoppato i buchi, ricostruito, puntellato, stava tutto in equilibrio.\"</em>", tags: ["verb"] },
  { it: "il cravattaro", en: "loan shark (ties people in debt)", hint: "From cravatta (tie) — strangles you financially. At the bank, strozzini, cravattari, camorristi all come through without anyone batting an eye", context: "<em>\"Da strozzini, cravattari, camorristi, senza dì un cazzo.\"</em>", tags: ["slang","noun"] },
  { it: "gli agganci", en: "connections / inside contacts", hint: "Agganciare = to hook. Agganci = contacts in the right places. Ce ho certi agganci nel mondo delle scommesse birichine", context: "<em>\"Io ho certi agganci nel mondo delle scommesse birichine.\"</em>", tags: ["slang","noun"] },
  { it: "la Madonna del faccio finta di niente", en: "patron saint of ignoring problems", hint: "Zero's invented saint — the Madonna of Pretending Everything's Fine. Her followers are everywhere and shape history", context: "<em>\"Chi ce l'ha l'altarino dedicato alla 'Madonna del faccio finta di niente e magari se risolve da solo'?\"</em>", tags: ["roman","idiom"] },
  { it: "il magone", en: "a lump in your throat / heaviness of heart", hint: "That specific heavy feeling of sadness or dread. Me pija il magone = I get that heavy-hearted feeling", context: "<em>\"L'altro giorno sò passato sotto casa sua e mi è preso il magone.\"</em>", tags: ["noun"] },
  { it: "il fattaccio", en: "the incident / the ugly thing that happened", hint: "From fatto + pejorative suffix. The bad event everyone knows about but doesn't name directly", context: "<em>\"È successo il fattaccio. Lo sai.\"</em>", tags: ["noun","slang"] },
  { it: "la grande pantomima", en: "the great charade / the whole pretense", hint: "La grande pantomima = the elaborate performance everyone keeps up without anyone saying what's real", context: "<em>\"Quel pomeriggio d'agosto in cui finalmente s'era interrotta la grande pantomima.\"</em>", tags: ["idiom","noun"] },
  { it: "egoriferito", en: "self-centered / only relating to yourself", hint: "Ego-referenced — filtering everything back through yourself. Sei una facciaccia di cazzo egoriferita! = you only talked about yourself!", context: "<em>\"Sei proprio una facciaccia di cazzo egoriferita! Praticamente hai parlato solo te!\"</em>", tags: ["slang"] },
  { it: "il sistema di caste", en: "the caste system (of school)", hint: "Zero's school social hierarchy — so rigid people came from India to study it. You could only speak to those equally uncool as yourself", context: "<em>\"A scuola mia c'era un sistema di caste rigidissimo. Venivano dall'India per studiarlo.\"</em>", tags: ["idiom","noun"] },
  { it: "infognato", en: "deep in it / mired / stuck", hint: "From fogna (sewer) — sunk into something murky. Sta infognata in una situazione brutta. Also: infognato con la merce = hooked on drugs", context: "<em>\"Sta infognata in una situazione brutta.\"</em>", tags: ["roman","slang"] },
  { it: "il pozzo senza fondo", en: "a bottomless pit", hint: "Fixed expression — something that consumes endless resources. I figli sò un pozzo senza fondo = kids are a bottomless pit", context: "<em>\"Non puoi capì, i figli sò un pozzo senza fondo.\"</em>", tags: ["idiom"] },

  // === EP 5 ===
  { it: "imbruttire", en: "to give dirty looks / intimidate", hint: "Imbruttirsi = to turn ugly/aggressive. Ci imbruttivano = they were eyeing us up aggressively, circling and giving hostile looks", context: "<em>\"Ci spizzavano, ci giravano intorno, ci imbruttivano.\"</em>", tags: ["roman","verb","slang"] },
  { it: "ingarellarsi", en: "to get drawn into a fight", hint: "Ingarellarsi = to take the bait, get into a confrontation you shouldn't. Non te fà mai ingarellà = don't get pulled into it", context: "<em>\"Tu per questo non te devi ingarellà con 'sti regazzini.\"</em>", tags: ["roman","verb","slang"] },
  { it: "la puncicata", en: "a little jab / a small stab", hint: "Diminutive of punta. Te dà una puncicata sulla chiappa — used to completely downplay the seriousness of being stabbed by a crime boss", context: "<em>\"Se proprio lo fai rosicà, te dà una puncicata sulla chiappa. Dritto per dritto, entra e esce.\"</em>", tags: ["roman","slang","noun"] },
  { it: "fare il bancomat", en: "to be someone's ATM", hint: "Being used purely as a money source. Sei il bancomat. Se uno vuole ritirà i soldi, non brucia il bancomat", context: "<em>\"Tu oggi non dovresti morì, non c'ha senso. Sei il bancomat.\"</em>", tags: ["roman","idiom"] },
  { it: "il tarlo in testa", en: "the nagging thought / the worm in your brain", hint: "Tarlo = woodworm. A thought that keeps boring into you, a nagging worry you can't shake", context: "<em>\"L'Armadillo mi continuava a ripetere l'unico tarlo che avevo in testa.\"</em>", tags: ["idiom","noun"] },
  { it: "collegare i puntini", en: "to connect the dots", hint: "In un attimo ho collegato tutti i puntini = in a second everything clicked. English calque fully absorbed into Italian", context: "<em>\"Si è aperto lo sportello del passeggero, e in un attimo ho collegato tutti i puntini.\"</em>", tags: ["idiom"] },
  { it: "il rottame sfiatato", en: "a worn-out wreck", hint: "Rottame = scrap, sfiatato = deflated/out of breath. Zero calling himself a worn-out old wreck while marveling at how high a kick went", context: "<em>\"Guarda 'sto rottame sfiatato quanto alza la gamba.\"</em>", tags: ["slang","noun"] },
  { it: "il piano inclinato", en: "the slippery slope", hint: "The physics concept as metaphor. Penso al piano inclinato che stiamo percorrendo = I think about the slippery slope we're on", context: "<em>\"Penso solo al piano inclinato che stiamo percorrendo.\"</em>", tags: ["idiom","noun"] },
  { it: "apparire annientato", en: "to look completely destroyed", hint: "Annientato = annihilated. Total psychological devastation — a person completely ground down by life", context: "<em>\"Me sembrava davvero una persona annientata.\"</em>", tags: ["verb"] },

  // === EP 6 ===
  { it: "sbroglià", en: "to untangle / sort out", hint: "Sbrogliare = to unravel a tangle. Qua ci stanno 40 situazioni da sbroglià. Practical synonym of districare", context: "<em>\"Qua ci stanno 40 situazioni da sbroglià. Cominciamo da quella più facile.\"</em>", tags: ["roman","verb"] },
  { it: "un'anima in pena", en: "a tormented soul", hint: "Literally 'soul in pain' — like a spirit that can't rest. Smeralda è un'anima in pena da tutta la vita", context: "<em>\"Smeralda, che è un'anima in pena da tutta la vita.\"</em>", tags: ["idiom","noun"] },
  { it: "lo slancio", en: "momentum / drive / forward energy", hint: "A burst of enthusiasm. Piena di slancio = full of drive. Its absence defines how Zero sees his friends a decade later", context: "<em>\"Tutta una roba piena di slancio. Guarda mò.\"</em>", tags: ["noun"] },
  { it: "buttare al cesso", en: "to flush down the toilet", hint: "Ha buttato al cesso tutto quello che aveva costruito = he flushed everything he'd built down the drain. For self-destruction", context: "<em>\"Ha buttato al cesso tutto quello che aveva costruito.\"</em>", tags: ["roman","idiom"] },
  { it: "la cosmetica della nostalgia", en: "the cosmetics of nostalgia", hint: "Zero's phrase — nostalgia is makeup applied to the past. Forse è tutta una cosmetica della nostalgia = maybe we're just making the past look better than it was", context: "<em>\"Forse è tutta una cosmetica della nostalgia e già stavamo su una zattera alla deriva.\"</em>", tags: ["idiom"] },
  { it: "squagliarsi il cuore", en: "my heart melts / it devastates me", hint: "'Sta domanda me squaglia il cuore. Squagliare = to melt — more visceral than just commuoversi", context: "<em>\"'Sta domanda me squaglia il cuore.\"</em>", tags: ["roman","idiom"] },
  { it: "la rana bollita", en: "the boiling frog", hint: "The famous metaphor — you don't notice the danger because it heats up so gradually. Used in the show for how abuse is normalized", context: "<em>\"Hai presente la storia della rana bollita? La rana sta nel pentolone d'acqua fredda, sta là che nuota felice.\"</em>", tags: ["idiom"] },
  { it: "sdrumato", en: "worn out / utterly depleted", hint: "Roman/colloquial — completely drained. La rana sta così stanca e sdrumata che non je la fa più a saltà fuori", context: "<em>\"Sta così stanca e sdrumata che non je la fa più a saltà fuori.\"</em>", tags: ["roman","slang"] },
  { it: "fare la predica", en: "to lecture / preach at someone", hint: "To give an unsolicited moral sermon. Non me fà la predica = don't lecture me. Especially galling when the person has no standing to do it", context: "<em>\"Davvero me stai a fà la predica? Chiedi il permesso per andà a piscià e vuoi risolvere la vita mia?\"</em>", tags: ["idiom"] },
  { it: "stanare", en: "to flush out / lure out of hiding", hint: "From tana (den/lair). Stanare = to draw someone out. Lo dovemo stanà fuori = we have to lure him out of his territory", context: "<em>\"Se lo volemo pijà, lo dovemo stanà fuori.\"</em>", tags: ["verb"] },
  { it: "girano col ferro", en: "they're carrying (guns)", hint: "Il ferro = iron, slang for a firearm. Girano col ferro = they go around armed. Me sò convinto: sicuro questi girano col ferro", context: "<em>\"Ormai me sò convinto: sicuro questi girano col ferro.\"</em>", tags: ["roman","slang","idiom"] },
  { it: "fare tutto un Maracanà", en: "to make a huge scene", hint: "The enormous Rio stadium as metaphor for a massive public commotion. Paturnia ha fatto tutto un Maracanà = made a stadium-sized scene", context: "<em>\"Ha menato a Montini per strada, ha fatto tutto un Maracanà.\"</em>", tags: ["roman","idiom"] },
  { it: "rimasto interdetto", en: "taken aback / at a loss", hint: "Speechless, unable to respond, completely thrown. 'Sta sentenza me lascia un po' interdetto = that statement leaves me somewhat at a loss", context: "<em>\"'Sta sentenza me lascia un po' interdetto.\"</em>", tags: [] },
  { it: "cose di lana caprina", en: "splitting hairs / trivial nitpicking", hint: "Fixed expression — goat wool = trivial things not worth debating. Non te impelagà in 'ste cose di lana caprina = don't get bogged down in the small stuff", context: "<em>\"Tiette sul vago, non te impelagà in 'ste cose di lana caprina.\"</em>", tags: ["idiom"] },
  { it: "non vonno spigne", en: "they won't deal drugs", hint: "Spingere/spigne (Roman) = to push/sell drugs. The brothers are old-school bank robbers with professional pride — they have limits", context: "<em>\"Non vonno spigne. Noi semo rapinatori qualificati.\"</em>", tags: ["roman","slang"] },
  { it: "rapinatori qualificati", en: "qualified / specialized robbers", hint: "The brothers' proud self-description — they're professionals (banks, post offices), not common dealers. Dark pride in criminal craft", context: "<em>\"Noi semo rapinatori qualificati. Io quella roba al limite me la pippo, di sicuro non me metto a vende.\"</em>", tags: ["roman","idiom"] },

  // === EP 8 ===
  { it: "bruciarsi i ponti", en: "to burn your bridges", hint: "Avrei bruciato ogni ponte che mi collegava alla dignità = I would have burned every bridge connecting me to dignity, just to say yes to her", context: "<em>\"Avrei bruciato ogni ponte che mi collegava alla dignità per dije: Certo che sò libero!\"</em>", tags: ["idiom"] },
  { it: "ingoiare N rospi", en: "to swallow toads / grit your teeth", hint: "Ingoiare un rospo = swallow a toad = force yourself through something unpleasant. Ho ingoiato 45 rospi before saying no to Smeralda", context: "<em>\"Ho ingoiato 45 rospi e je ho detto: me sa che sabato esco con una persona.\"</em>", tags: ["idiom"] },
  { it: "essere cristallizzato", en: "to be frozen / stuck in time", hint: "Remaining unchanged while everything around you moves forward. Io sto qua cristallizzato come un coglione eterno adolescente", context: "<em>\"Io sto qua cristallizzato come un coglione eterno adolescente, mentre Secco è sbocciato come una crisalide.\"</em>", tags: ["idiom"] },
  { it: "sbocciare come una crisalide", en: "to bloom from a chrysalis / emerge transformed", hint: "The opposite of being crystallized — actually becoming something new. Secco è uscito dal suo cliché", context: "<em>\"Secco è sbocciato come una crisalide, è uscito dal suo cliché.\"</em>", tags: ["idiom"] },
  { it: "squartato sul marciapiede", en: "gutted on the pavement", hint: "Squartare = to quarter/gut. Brutally vivid image for a stabbing victim delivered with Zerocalcare's sardonic understatement", context: "<em>\"Ce sta che se lo vede squartato sul marciapiede sta un po' turbata. Certo che ci sta, grazie ar cazzo!\"</em>", tags: ["roman","verb"] },
  { it: "l'accrocco", en: "a cobbled-together contraption", hint: "Something held together with string and hope. Le case non sò di pietra, sò un accrocco che si regge con lo sputo e con lo Xanax", context: "<em>\"Tutto un accrocco che si regge con lo sputo e con lo Xanax.\"</em>", tags: ["roman","slang","noun"] },
  { it: "reggersi con lo sputo", en: "held together with spit", hint: "Something so fragile it's only held up by spit. Zero's image for their lives — not stone houses but wrecks held together by spit and Xanax", context: "<em>\"Tutto un accrocco che si regge con lo sputo e con lo Xanax.\"</em>", tags: ["roman","idiom"] },
  { it: "accartocciato", en: "crumpled up / huddled alone", hint: "From cartoccio (paper cone). Accartocciati e soli = crumpled up and alone, like a discarded piece of paper", context: "<em>\"E dentro ce stamo noi, accartocciati e soli, a pregà che il lupo non venga a soffià.\"</em>", tags: ["verb"] },
  { it: "sparpagliati dopo il naufragio", en: "scattered after the shipwreck", hint: "Sparpagliato = scattered. After the wreck everyone drifts apart. Zero's final image for his generation", context: "<em>\"Sparpagliati dopo il naufragio. Manco famo più la conta di quelli che se semo persi per strada.\"</em>", tags: ["idiom"] },
  { it: "rifiatare", en: "to catch your breath / rest briefly", hint: "Literally to breathe again. Mò stamo un attimo a rifiatà, ma poi sistemamo tutto = we're just catching our breath, but then we'll fix everything", context: "<em>\"Mò adesso stamo un attimo a rifiatà, ma poi sistemamo tutto.\"</em>", tags: ["verb"] },
  { it: "il grande impianto giustificatorio", en: "the justification framework / the story you tell yourself", hint: "The elaborate system of reasoning you build to excuse your behavior. La grande narrazione razionale = the grand rational narrative", context: "<em>\"C'era qualcosa di terribile che rischiava di spazzà via tutto il mio grande impianto giustificatorio.\"</em>", tags: ["idiom","noun"] },
  { it: "scartavetrare via", en: "to sand away / grind away until nothing's left", hint: "Scartavetro = sandpaper. When you think you've sanded down all the feeling — but it comes back anyway", context: "<em>\"Pure quando sei sicuro che ormai hai scartavetrato via tutto, che pensi che ormai non te può più fà male.\"</em>", tags: ["verb","idiom"] },
  { it: "la speranza che questa volta è quella buona", en: "the hope that this time is the one", hint: "The final word of the show. Ti ammazza e ti riammazza mille volte in una vita sola. La speranza che questa volta è quella buona", context: "<em>\"La speranza che questa volta è quella buona.\"</em>", tags: ["idiom","noun"] },

  // === NEW FROM TRANSCRIPT MINING ===
  { it: "essere allo sbando", en: "to be adrift / rudderless", hint: "Without direction, completely lost. Lo sbando = the state of drifting. A whole generation senza un punto fermo", context: "<em>\"Eravamo i trentenni del nuovo millennio, allo sbando senza un punto fermo.\"</em>", tags: ["idiom"] },
  { it: "vessat* dalla vita", en: "ground down by life / harassed by fate", hint: "Vessare = to oppress, torment, harass. Vestato/a dalla vita — what Zerocalcare calls the 5am metro creatures", context: "<em>\"Creature dolenti, vessate dalla vita.\"</em>", tags: ["verb"] },
  { it: "furtivo", en: "furtive / stealthy", hint: "Moving furtively — like the creatures of the early-morning metro who slink around before sunrise", context: "<em>\"Che si muovono furtive prima del sorgere del sole.\"</em>", tags: [] },
  { it: "mortifero", en: "deadly / death-dealing", hint: "From morte (death) — bringing death, lethal. Used for atmosphere: cupo, angoscioso e mortifero = dark, anguishing and death-dealing", context: "<em>\"Cupo, angoscioso e mortifero.\"</em>", tags: [] },
  { it: "il groviglio", en: "tangle / knot / snarl", hint: "A tangled mess — of thread, thoughts, nerves. Dal groviglio dei tuoi nervi = from the tangle of your nerves", context: "<em>\"Dal groviglio dei tuoi nervi.\"</em>", tags: ["noun"] },
  { it: "te fai piacé una e te ce aggrappi", en: "you latch onto someone you like", hint: "Aggrapparsi = to cling, to grab onto. The survival instinct of finding someone to hold onto in a bad situation", context: "<em>\"Te fai piacé una e te ce aggrappi.\"</em>", tags: ["roman","idiom"] },
  { it: "sennò uno s'ammazza", en: "otherwise you'd kill yourself", hint: "Used hyperbolically — 'you need a reason to get up in the morning, otherwise...' Very Zerocalcare dark humor", context: "<em>\"Serve per trovà un motivo per fà le cose, sennò uno s'ammazza.\"</em>", tags: ["roman","idiom"] },
  { it: "mannare per le ossa", en: "to send someone packing / get rid of", hint: "Roman expression — literally 'send to the bones.' Voleva mannarlo per le ossa = wanted to be done with him", context: "<em>\"Se voleva mannà per l'ossa il licaone.\"</em>", tags: ["roman","idiom"] },
  { it: "non regge", en: "it doesn't hold up / it falls apart", hint: "Reggere = to hold, to bear. Non regge (fuori da quel contesto) = it doesn't work outside that context. Relationship or argument that can't survive scrutiny", context: "<em>\"Non regge, fuori da quel contesto.\"</em>", tags: ["idiom"] },
  { it: "triturato", en: "ground up / pulverized", hint: "From triturare = to grind to a pulp. Used here for beating a topic to death — triturato, bollito, sporzionato, surgelato", context: "<em>\"L'hai fatto a pezzi, triturato, bollito, sporzionato, surgelato.\"</em>", tags: ["verb"] },
  { it: "la monnezza", en: "trash / garbage (Roman)", hint: "Roman dialect for immondizia (rubbish). Also used figuratively for junk TV, garbage people, low-quality anything", context: "<em>\"La civiltà che studierà la monnezza che accumulavo a casa.\"</em>", tags: ["roman","slang","noun"] },
  { it: "zozzo", en: "filthy / gross / disgusting", hint: "Roman/colloquial for filthy, unhygienic, revolting. Il cesso mio è zozzo = my bathroom is disgusting", context: "<em>\"È zozzo, pieno di forme di vita ostili.\"</em>", tags: ["roman","slang"] },
  { it: "fare i cazzi propri", en: "to mind your own business", hint: "Me faccio i cazzi miei = I'll mind my own business. Direct, no-nonsense way to say stay out of it", context: "<em>\"Figurati, me faccio i cazzi miei.\"</em>", tags: ["roman","idiom"] },
  { it: "croce sul cuore", en: "cross my heart", hint: "Literally 'cross on the heart' — a solemn oath. Croce sul cuore, me porto il segreto alla morte = cross my heart, I'll take this to the grave", context: "<em>\"Croce sul cuore, me porto il segreto alla morte.\"</em>", tags: ["idiom"] },
  { it: "da pecora bastonata", en: "like a beaten sheep", hint: "Looking dejected, pathetic, defeated. Fà 'sta faccia da pecora bastonata = stop making that beaten-sheep face", context: "<em>\"Invece di fà 'sta faccia da pecora bastonata?\"</em>", tags: ["roman","idiom"] },
  { it: "immacolato", en: "immaculate / spotless", hint: "Literally spotless — from the Immaculate Conception. Deve rimanè tutto immacolato = everything must stay pristine. Used sarcastically", context: "<em>\"Deve rimané tutto immacolato.\"</em>", tags: [] },
  { it: "il prestanome", en: "front man / straw man", hint: "Literally 'lend your name' — someone who puts their name on things owned by someone else, usually for money laundering. Key concept in the show's crime plot", context: "<em>\"Hanno accettato di fà i prestanome dei Tartallegra.\"</em>", tags: ["noun","slang"] },
  { it: "il riciclaggio", en: "money laundering", hint: "Literally 'recycling' — riciclare also means to recycle. In criminal context, riciclaggio di denaro = laundering money", context: "<em>\"L'usura, il riciclaggio, tutte quelle cose che finiscono in -ura.\"</em>", tags: ["noun","slang"] },
  { it: "l'usura", en: "loan sharking / usury", hint: "Charging extreme interest rates illegally. From the same Latin root as English 'usury.' Part of the Tartallegra's business model", context: "<em>\"Lo spaccio, il riciclaggio, l'usura, la tortura.\"</em>", tags: ["noun","slang"] },
  { it: "mettere una toppa", en: "to put a patch on it / stopgap fix", hint: "Toppa = a patch (on clothing). Mettere una toppa = to patch something up temporarily, not a real solution", context: "<em>\"Capiamo se ci possiamo almeno mette una toppa.\"</em>", tags: ["idiom"] },
  { it: "la comfort zone", en: "comfort zone", hint: "Used directly in Italian — non è proprio la nostra comfort zone = not exactly our comfort zone. English loanword fully absorbed", context: "<em>\"Trattà coi Tartallegra non è proprio la nostra comfort zone.\"</em>", tags: ["slang"] },
  { it: "l'asticella che sale", en: "the bar keeps rising", hint: "Asticella = the bar in high jump. L'asticella deve salì sempre = the bar has to keep going up. Used for escalating relationship fights or expectations", context: "<em>\"L'asticella deve salì sempre. È come nei videogiochi.\"</em>", tags: ["idiom"] },
  { it: "il DEFCON 1", en: "maximum alert / worst case scenario", hint: "DEFCON 1 = US military highest alert level, used colloquially to mean we're at maximum crisis. La situazione è DEFCON 1", context: "<em>\"Vuol dì che la situazione è DEFCON 1.\"</em>", tags: ["slang"] },
  { it: "il Grillo Parlante", en: "the talking cricket / unsolicited moral advice", hint: "The cricket from Pinocchio who gives unwanted wisdom. Una banalità da Grillo Parlante = a Jiminy Cricket platitude you didn't ask for", context: "<em>\"Una banalità da Grillo Parlante, tiè.\"</em>", tags: ["idiom"] },
  { it: "fare brainstorming", en: "to brainstorm", hint: "Direct English loanword. Famo brainstorming = let's brainstorm. Used completely naturally in Italian conversation", context: "<em>\"Tocca tirà fuori un'idea. Dimo cose, famo brainstorming.\"</em>", tags: ["slang"] },
  { it: "la cagata / la cazzata", en: "a stupid thing / a screw-up / bullshit", hint: "Cazzata (from cazzo) = stupid thing, blunder, nonsense. Cagata (from cagare) = same register. Both extremely common in Italian", context: "<em>\"Poi je parte la brocca e fanno qualche cazzata.\"</em>", tags: ["slang"] },
  { it: "il fuorilegge", en: "outlaw", hint: "Literally 'outside the law.' Fascino da fuorilegge = outlaw charm. The romantic appeal of someone who lives outside the rules", context: "<em>\"Quel fascino da fuorilegge.\"</em>", tags: ["noun"] },
  { it: "assaltare un portavalori", en: "to rob an armored car", hint: "Portavalori = armored security vehicle. Assaltare = to assault/raid. Suggested as a way to seem dangerous and romantic", context: "<em>\"Vai a Cerignola a assaltà un portavalori.\"</em>", tags: ["idiom"] },
  { it: "il tarabozzolo", en: "a huge bruiser / massive guy", hint: "Roman slang — a big, hulking person, a giant. The huge man who appears and destroys Zero's romantic moment at the bar", context: "<em>\"Arrivò un tarabozzolo che acchiappa il tipo.\"</em>", tags: ["roman","slang","noun"] },
  { it: "grattugiare la faccia al muro", en: "to grind someone's face against the wall", hint: "Grattugiare = to grate (like cheese). The tarabozzolo grates the guy's face along the wall. Extremely vivid violence metaphor", context: "<em>\"Je grattugia la faccia al muro e gliela sbatte contro un tavolino.\"</em>", tags: ["roman","idiom"] },
  { it: "l'escalation", en: "escalation", hint: "Direct loanword from English/French. Un'escalation con cui non potevo competere = an escalation I couldn't compete with", context: "<em>\"Un'escalation con cui oggettivamente io non potevo compete.\"</em>", tags: ["slang"] },
  { it: "alzare le mani", en: "to give up / throw in the towel", hint: "Literally 'raise your hands' — surrender. A una certa ho alzato le mani = at some point I gave up. Also literally means to raise hands to hit someone depending on context", context: "<em>\"A una certa ho alzato le mani.\"</em>", tags: ["idiom"] },
  { it: "il numero anonimo", en: "an unknown/blocked caller", hint: "Numero anonimo = withheld number. Refusing to answer a blocked call = refusing to deal with whoever is trying to trap you", context: "<em>\"Preferisco infilà un dito nel temperamatite prima di risponde a un numero anonimo.\"</em>", tags: ["noun"] },
  { it: "attaccarsi come una cozza allo scoglio", en: "to cling like a mussel to a rock", hint: "Cozza = mussel, scoglio = rock. Attaccarsi come una cozza = to latch on and refuse to let go, like an unwanted obligation", context: "<em>\"Un accollo che ti si vuole attaccà come una cozza allo scoglio.\"</em>", tags: ["idiom"] },
  { it: "il mezzuccio", en: "a sneaky little trick / cheap tactic", hint: "Diminutive of mezzo (means/method) — a petty, underhanded little trick. The blocked call as a mezzuccio to catch you off guard", context: "<em>\"Per questo usa questo mezzuccio della chiamata anonima.\"</em>", tags: ["slang","noun"] },
  { it: "sdebitar si", en: "to repay a debt / make it up to someone", hint: "Debito = debt. Sdebitarsi = to clear a debt, to pay someone back for a favor. Come mi posso sdebitare? = How can I make it up to you?", context: "<em>\"Come mi posso sdebità per la tua ospitalità?\"</em>", tags: ["verb"] },
  { it: "ingranare", en: "to get going / get into gear", hint: "From ingranaggio (gear). La mattina ci metto un po' a ingranare = in the morning it takes me a while to get into gear. Very natural Italian", context: "<em>\"La mattina ci metto un po' a ingranà le funzioni di base.\"</em>", tags: ["verb"] },
  { it: "i versi gutturali", en: "guttural sounds / gruntings", hint: "Gutturale = from the throat. Used hilariously to describe someone who communicates only in grunts (Secco)", context: "<em>\"Non solo perché ti esprimi con versi gutturali.\"</em>", tags: ["slang"] },
  { it: "la ceretta (integrale)", en: "waxing / full body wax", hint: "Ceretta = wax strip hair removal. Integrale = full/complete. Source of one of the episode's most memorable rants about female endurance", context: "<em>\"Io stamattina mi sò fatta l'inguine. Fidate che è peggio.\"</em>", tags: ["noun"] },
  { it: "frollare come un manzo", en: "to tenderize like beef", hint: "Frollare = to age/tenderize meat. Used for what the women will do to the men when they 'rise up' — tenderize them like Kobe beef", context: "<em>\"Li frollamo come un manzo di Kobe!\"</em>", tags: ["roman","idiom"] },
  { it: "macerare nell'ansia", en: "to marinate in anxiety", hint: "Macerare = to steep/macerate food. Me sò messo a macerà nell'ansia = I just sat steeping in my anxiety. Another food metaphor for emotional suffering", context: "<em>\"Me sò messo a macerà nell'ansia.\"</em>", tags: ["idiom"] },
  { it: "schioppare", en: "to burst / explode", hint: "Roman/southern dialect for scoppiare (to burst). Il cuore che stava a schioppà = my heart about to explode. More physical, more Roman than scoppiare", context: "<em>\"Il cuore mio che stava a schioppà.\"</em>", tags: ["roman","verb"] },
  { it: "impicciare il cervello", en: "to get your brain jammed up", hint: "Impicciare = to entangle, to jam. Me s'è impicciato il cervello = my brain seized up. When shock or fear completely short-circuits your thinking", context: "<em>\"Non so che è successo quando ha messo giù. Me s'è impicciato il cervello.\"</em>", tags: ["roman","idiom"] },
  { it: "annaspare", en: "to flounder / gasp / thrash around", hint: "Like someone drowning who can't get a grip. Annaspavo = I was floundering. Panic without direction", context: "<em>\"Annaspavo e manco capivo come ero passato...\"</em>", tags: ["verb"] },
  { it: "il libero arbitrio", en: "free will", hint: "Philosophical term used sarcastically — almeno non c'è più la rottura di cazzo del libero arbitrio = at least you don't have the annoying burden of free will anymore", context: "<em>\"Almeno non c'è più quella rottura di cazzo del libero arbitrio.\"</em>", tags: ["noun"] },
  { it: "stare in apnea", en: "to hold your breath / white-knuckle it", hint: "Apnea = breath-holding (as in free-diving). Used for getting through something terrifying by not breathing. Entro in apnea = I go in holding my breath", context: "<em>\"Entro in apnea, luce spenta, occhi chiusi.\"</em>", tags: ["idiom"] },
  { it: "la fortezza", en: "the fortress / emotional walls", hint: "In Zerocalcare's metaphor, the fortezza = the person's inner self. Protected by walls, with a trapdoor (la botola) hiding the darkest parts", context: "<em>\"Nessuno ci deve entrà qua. Questa è la fortificazione suprema.\"</em>", tags: ["noun","idiom"] },
  { it: "ci sbraga il cuore", en: "it tears our heart apart", hint: "Sbragare (from braghe) — to rip open. Ci sbraga il cuore = it rips our heart apart. Tiziano Ferro ci sbraga il cuore = Tiziano Ferro destroys us emotionally", context: "<em>\"Lo sai che Tiziano Ferro ci sbraga il cuore a noi millennial di periferia.\"</em>", tags: ["roman","idiom"] },
  { it: "di periferia", en: "from the suburbs / from the outskirts", hint: "Periferia = the outskirts, the suburban/working-class edges of a city. Millennial di periferia = a particular Italian identity — suburban, not wealthy, emotionally shaped by pop music", context: "<em>\"Noi millennial di periferia.\"</em>", tags: ["noun"] },
  { it: "ricascarci sempre", en: "to always fall back into it", hint: "Ricascare = to fall back in (after getting out). Ce ricasco sempre = I always fall back into it. For patterns you can't break — bad relationships, bad habits", context: "<em>\"Poi però me passa e ce ricasco sempre.\"</em>", tags: ["verb","idiom"] },
  { it: "stranito", en: "dazed / out of it / spaced out", hint: "From strano (strange) — looking strangely distracted, not quite present. Stavi stranito = you seemed out of it", context: "<em>\"Dice Smeralda che stavi stranito.\"</em>", tags: ["slang"] },
  { it: "la prepotenza", en: "a bullying act / an act of arrogance", hint: "Prepotente = bully/arrogant. Faje passà una prepotenza = to let a bullying act slide. Se je fai passà una prepotenza anche una volta, poi te la fanno per tutta la vita", context: "<em>\"Se je fai passà una prepotenza anche una volta sola, poi te la fanno per tutta la vita.\"</em>", tags: ["noun","slang"] },
  { it: "sfondare la macchina a martellate", en: "to smash a car with a hammer", hint: "Sfondare = to break through/smash in. Her revenge on the man who pulled her hair — destroying his beloved car with a hammer", context: "<em>\"Il giorno dopo gli ho sfonnato la macchina a martellate.\"</em>", tags: ["roman","idiom"] },
  { it: "incarognirsi", en: "to become hardened / vicious", hint: "From carogna (carcass/bastard). Incarognirsi = to become mean and hardened through suffering. Used for how violence toughens people", context: "<em>\"Se incarognivano e se abituavano al dolore.\"</em>", tags: ["verb","slang"] },
  { it: "il grumo nero", en: "a dark clot / a dark mass", hint: "Grumo = a clot, a lump. Un grumo nero = a dark dense clot of bad things. Zerocalcare's image for what Smeralda's life had become", context: "<em>\"Che cazzo di grumo nero era diventata la vita sua in questi anni.\"</em>", tags: ["noun","idiom"] },
  { it: "una specie di mostro a cui si era abituata", en: "a kind of monster she'd gotten used to", hint: "The situation had become a monster she no longer noticed because she'd grown up alongside it. A powerful image for normalized abuse", context: "<em>\"Una specie di mostro a cui forse si era pure abituata.\"</em>", tags: ["idiom"] },
  { it: "il capriolo", en: "roe deer", hint: "A small deer — used in the wedding venue description: stuffed inside a sack tied to a roe deer going up a mountain. One of the show's absurdist travel images", context: "<em>\"Te infili dentro un sacco legato a un capriolo che va su per una montagna.\"</em>", tags: ["noun"] },
  { it: "il casale", en: "farmhouse / rural building", hint: "A country house or farmhouse — where everyone has to sleep together at destination weddings. Poi ci sta solo un casale", context: "<em>\"Poi ci sta solo un casale dove alla fine dovete dormì tutti insieme.\"</em>", tags: ["noun"] },
  { it: "barrato tutte le caselle", en: "ticked all the boxes", hint: "Barrare = to cross off. Ho barrato tutte le caselle = I've ticked every box — done everything there was to do, nothing left", context: "<em>\"Ho fatto tutto, ho barrato tutte le caselle. Me manca solo questo.\"</em>", tags: ["idiom"] },
  { it: "il riposo del guerriero", en: "the warrior's rest", hint: "Fixed Italian expression — settling down after you've done everything. Used sarcastically: hai deciso di sposarti perché ti sei stancato", context: "<em>\"È tipo il riposo del guerriero.\"</em>", tags: ["idiom"] },
  { it: "commiserazione", en: "pity / condescension", hint: "Looking at someone with a mix of pity and mild contempt. Con un misto di stanchezza e commiserazione = with a mix of exhaustion and pity", context: "<em>\"Mi ha guardato con un misto di stanchezza e di commiserazione.\"</em>", tags: ["noun"] },
  { it: "la mappa delle scopate", en: "the sex map (ironic)", hint: "Zerocalcare's joke about someone who has slept with so many people they need a map divided by region and altitude. Used to set up the 'riposo del guerriero' punchline", context: "<em>\"Hai una mappa delle scopate divisa per regioni, ma pure per altitudini e dislivelli.\"</em>", tags: ["roman","idiom"] },
  { it: "i carbonari", en: "the Carbonari", hint: "19th century Italian secret revolutionary society — meeting in secret like the Carbonari = meeting in total secrecy late at night", context: "<em>\"Se semo visti di notte come i carbonari.\"</em>", tags: ["noun"] },
  { it: "guardare per terra", en: "to look at the floor (avoiding responsibility)", hint: "Everyone looking at their shoes when someone needs to volunteer for the hard task. Guardano per terra perché lo può dì una persona sola", context: "<em>\"Guardano per terra perché lo può dì una persona sola.\"</em>", tags: ["idiom"] },
  { it: "tiè", en: "there you go / take that", hint: "Roman expression — short for 'tieni' (take/here). Used triumphantly: tiè, as in 'there, I told you so' or 'here, deal with it'", context: "<em>\"Una banalità da Grillo Parlante, tiè.\"</em>", tags: ["roman","slang"] },
  { it: "l'aggravante", en: "aggravating circumstance", hint: "Legal term — opposite of attenuante. Con aggravante zoofila = with the aggravating circumstance of bestiality. Used for darkly comic escalation of a story", context: "<em>\"Era un amore di salvataggio. In questo caso con aggravante zoofila, ma vabbè.\"</em>", tags: ["noun"] },
  { it: "scennere", en: "to come down (Roman for scendere)", hint: "Roman dialect pronunciation — the -nd- becomes -nn-. Scennevo = I got off (the train). Part of the pattern of Roman phonetic softening", context: "<em>\"Tre fermate, poi scennevo per pijà il treno.\"</em>", tags: ["roman","verb"] },
  { it: "pijà", en: "to take / grab (Roman for prendere)", hint: "The most Roman verb there is — prendere becomes pijare. Pijà la metro, pijà a calci, pijà i soldi — you'll hear it in every other sentence", context: "<em>\"Andavo a pijà la metro alle cinque.\"</em>", tags: ["roman","verb"] },
  { it: "fare il dito al culo", en: "to do a useless/degrading job", hint: "Literally 'do the finger up the backside' — crude Roman expression for a job that's both pointless and humiliating", context: "<em>\"Il resto del giorno di lavoro fai il dito al culo.\"</em>", tags: ["roman","slang","idiom"] },
  { it: "procurato allarme", en: "causing a false alarm (legal term)", hint: "Legal offense — deliberately triggering a false emergency. Used here as a mock-serious accusation between friends", context: "<em>\"Ma a me me avete fatto uscì apposta e manco se menamo? Questo è procurato allarme.\"</em>", tags: ["noun","slang"] },
  { it: "col cazzo", en: "absolutely not / like hell", hint: "Strong refusal — 'with the d***.' Col cazzo che succede = there's no way that's happening. The punchline to the pension monologue: Le pensioni... col cazzo!", context: "<em>\"Stiamo pensando a delle pensioni speciali per voi. Le pensioni… col cazzo!\"</em>", tags: ["roman","slang","idiom"] },

  // === EP1 DEEP MINE ===
  { it: "l'anfratto maligno", en: "a malignant recess / dark corner", hint: "Anfratto = a crevice or recess. Un anfratto maligno dell'anima = a sinister pocket of the soul where time passes differently — Zero's description of a YouTube rabbit hole", context: "<em>\"A me 'sti video mi risucchiano in una zona oscura dell'anima, un anfratto maligno in cui il tempo scorre diversamente.\"</em>", tags: ["noun"] },
  { it: "risucchiare", en: "to suck in / pull under", hint: "From succhiare (to suck). Risucchiare = to pull something in like a vortex. Me risucchiano in una zona oscura = they suck me into a dark zone", context: "<em>\"A me 'sti video mi risucchiano in una zona oscura dell'anima.\"</em>", tags: ["verb"] },
  { it: "vero in differita", en: "true in retrospect / true on a delay", hint: "Differita = delayed broadcast. Sarà vero in differita = it'll be true by the time you read it. The art of crafting a message that's technically accurate but not yet", context: "<em>\"Non è vero ora. Sarà vero in differita!\"</em>", tags: ["roman","idiom"] },
  { it: "gli ausiliari infami", en: "the dreaded parking wardens", hint: "Ausiliari del traffico = traffic wardens. Infami = infamous/treacherous. Adding them as a detail to make a fake excuse sound more credible", context: "<em>\"Dije che la devi mette bene perché girano gli ausiliari infami.\"</em>", tags: ["roman","idiom"] },
  { it: "fà rode er culo", en: "to make someone's arse burn with annoyance", hint: "Rodere = to gnaw. Roman expression: rode er culo = gnawing at the backside = making someone furious with impatience. 'Questa se sta a fà rode er culo'", context: "<em>\"Armadì, questa se sta a fà rode er culo.\"</em>", tags: ["roman","idiom"] },
  { it: "la sceneggiata", en: "a dramatic scene / performance", hint: "From sceneggiatura (screenplay). Una sceneggiata = an over-the-top dramatic performance. Le famo tutti i giorni 'ste sceneggiate = we do these dramatic scenes every day", context: "<em>\"Le famo tutti i giorni 'ste sceneggiate. Gestiamo tutto.\"</em>", tags: ["noun","slang"] },
  { it: "sgamare", en: "to catch out / see through a lie", hint: "Pure Roman slang — to catch someone in a lie, to see through a trick. Le cazzate se sgamano sempre = bullshit always gets caught out", context: "<em>\"Non devi mentì. Le cazzate se sgamano sempre.\"</em>", tags: ["roman","verb","slang"] },
  { it: "il giovane precario", en: "the young precarious worker", hint: "Precario = precarious employment (no contract, no stability). A key Italian social category — the millennial doing gig work and tutoring to survive", context: "<em>\"Sò un giovane precario, faccio le ripetizioni, strappo lungo i bordi.\"</em>", tags: ["noun"] },
  { it: "strappo lungo i bordi", en: "tearing along the edges / scraping by", hint: "Literally tearing along the perforations — the image of barely surviving, cutting things close. Part of Zero's parody of how others see him", context: "<em>\"Sò un giovane precario, faccio le ripetizioni, strappo lungo i bordi.\"</em>", tags: ["roman","idiom"] },
  { it: "il baraccio", en: "a dive / a dump of a place", hint: "Diminutive/pejorative of baracca (shack). Un baraccio = a terrible dump of a venue. È un baraccio con tre stelle salmonella = it's a dive with three salmonella stars", context: "<em>\"È un baraccio con tre stelle salmonella.\"</em>", tags: ["roman","slang","noun"] },
  { it: "il silenzio prima di un'inculata", en: "the calm before getting screwed", hint: "Zero's visceral reading of a social situation: the pregnant pause before someone propositions you into something you'll regret", context: "<em>\"Questo è il silenzio prima di un'inculata, vè?\"</em>", tags: ["roman","idiom"] },
  { it: "stà a galla", en: "to stay afloat / keep your head above water", hint: "Literally to float on water. Stare a galla = to just barely survive financially or emotionally. Va una merda? No, sta a galla", context: "<em>\"Perché me lo chiedi? Va una merda, vè? Ma no, sta a galla.\"</em>", tags: ["idiom"] },
  { it: "peccato di hubris / tracotanza", en: "the sin of hubris / arrogance before the gods", hint: "Hubris and tracotanza (overweening pride) — Zero treats spending money as an act of cosmic arrogance that will be punished. Filling a tank = hubris", context: "<em>\"Sò tutte cose che me sembrano peccà di hubris, di tracotanza di fronte agli dèi.\"</em>", tags: ["idiom"] },
  { it: "mi gira storto", en: "things go sideways for me / I get unlucky", hint: "Girare storto = to turn crooked/wrong. Qua è un attimo che me gira storto = it's a moment away from going wrong for me", context: "<em>\"Ma che ne sai, qua è un attimo che me gira storto!\"</em>", tags: ["roman","idiom"] },
  { it: "l'era mesozoica", en: "the Mesozoic era (ironic)", hint: "The dinosaur age — used ironically for the era when parents were young and had adult responsibilities at 20. That prehistoric time when things made sense", context: "<em>\"I genitori nostri hanno vissuto in quell'era mesozoica in cui a 20 anni eri già un adulto.\"</em>", tags: ["idiom"] },
  { it: "impratichirsi", en: "to become skilled / get the hang of something", hint: "From pratica (practice). Si sò impratichiti = they got the hang of it, they developed competence. Used sarcastically — they got good at being adults while we didn't", context: "<em>\"Si sò impratichiti! Poi hanno deciso che la generazione nostra doveva esse pagata solo in Goleador.\"</em>", tags: ["verb"] },
  { it: "pagato in Goleador", en: "paid in Goleador (candy) / exploited", hint: "Goleador = an Italian football candy. Being paid in Goleador = being given worthless compensation, working for nothing. Generational economic metaphor", context: "<em>\"Hanno deciso che la generazione nostra doveva esse pagata solo in Goleador fino a 80 anni.\"</em>", tags: ["roman","idiom"] },
  { it: "la reiettitudine", en: "loser-ness / outcast status", hint: "Zero's invented noun — from reietto (outcast/reject). Il livello di reiettitudine di Montini = the level of outcast-hood Montini had reached. A degree of social rejection", context: "<em>\"Nessuno raggiungeva il livello di reiettitudine di Montini.\"</em>", tags: ["roman","slang","noun"] },
  { it: "je rodeva il chiccherone", en: "something was gnawing at them / they had a grudge", hint: "Rodere = to gnaw. Chiccherone = Roman slang for the backside/ego. Je rodeva il chiccherone = it was eating at them, they woke up in a bad mood", context: "<em>\"Qualunque stronzo si svegliasse la mattina che je rodeva il chiccherone.\"</em>", tags: ["roman","idiom","slang"] },
  { it: "essere impicciato", en: "to be in trouble / tangled up", hint: "Impicciato = entangled, in a mess. Sta impicciato = he's in trouble, caught up in something. Also impicciare il cervello = to jam up the brain", context: "<em>\"Sta impicciato, Sà. Ma non so come parlacce per chiedeje 'ste cose.\"</em>", tags: ["roman","slang"] },
  { it: "nun me regge de affrontà", en: "I can't face it / don't have the energy", hint: "Reggere = to hold, to bear. Nun me regge = I can't bear it, I don't have the strength. Roman dialect: nun = non, de = di", context: "<em>\"Mò sto affaticato, nun me regge de affrontà 'sta discussione.\"</em>", tags: ["roman","idiom"] },
  { it: "tirare fuori (una cosa)", en: "to get something off your chest / bring it up", hint: "Tirare fuori = to pull out. Grazie che almeno l'ho tirata fuori = thanks that at least I got it out. The act of voicing something you've been carrying", context: "<em>\"Comunque grazie che almeno l'ho tirata fuori.\"</em>", tags: ["idiom"] },
  { it: "il rabdomante del disagio", en: "the water-diviner of dysfunction", hint: "Rabdomante = water diviner (uses a dowsing rod). Il rabdomante del disagio = someone who seeks out troubled, dysfunctional people with the precision of a divining rod", context: "<em>\"Sei il rabdomante del disagio! Stai proprio là che te lo cerchi con la bacchetta.\"</em>", tags: ["roman","idiom"] },
  { it: "le qualità nascoste", en: "hidden qualities / latent potential", hint: "Scommettere sulle qualità nascoste = to bet on someone's hidden potential. What idealists do when they choose problematic people", context: "<em>\"Io sò una che dà fiducia all'umanità. Me piace scommette sulle qualità nascoste.\"</em>", tags: ["idiom","noun"] },
  { it: "sganciare la bomba", en: "to drop the bomb / spring a surprise", hint: "Ti ha già sganciato la bomba, 'sta paracula? = Has she already dropped the bomb on you, the crafty so-and-so? The moment a big reveal is made", context: "<em>\"Ti ha già sganciato la bomba, 'sta paracula?\"</em>", tags: ["roman","idiom"] },
  { it: "la paracula", en: "a crafty/calculating woman", hint: "From culo (backside) + para (to parry/protect). A woman who's very clever at protecting her interests, getting others to do what she wants. Used affectionately-sarcastically", context: "<em>\"Ti ha già sganciato la bomba, 'sta paracula?\"</em>", tags: ["roman","slang","noun"] },
  { it: "je ha preso uno sturbo", en: "he had a fit / went crazy", hint: "Sturbo = a Roman word for a sudden attack of madness or fainting. Je ha preso uno sturbo = he had an episode, he freaked out, he lost it completely", context: "<em>\"Oh, je ha preso uno sturbo.\"</em>", tags: ["roman","slang","noun"] },
  { it: "essere un pupazzo", en: "to be a puppet / pushover", hint: "Pupazzo = puppet/stuffed toy. Alla fine fa come dico io, è un pupazzo = in the end he does what I say, he's a puppet. Someone easily manipulated", context: "<em>\"Non te preoccupà, con lui ci parlo io. Alla fine fa come dico io, è un pupazzo.\"</em>", tags: ["slang","idiom"] },
  { it: "mozzicàrsi la lingua", en: "to bite your tongue", hint: "Mozzicàrsi = to bite off. Ho dovuto mozzicàrmi la lingua = I had to bite my tongue. The physical effort of not saying what you're thinking", context: "<em>\"Sò un giudicone, quindi me sò dovuto mozzicà la lingua per non dije a Sarah...\"</em>", tags: ["idiom"] },
  { it: "trattato a pesci in faccia", en: "treated like dirt / slapped in the face with fish", hint: "Pesci in faccia = fish in the face. A very Italian expression for being disrespected, dismissed, treated with contempt", context: "<em>\"Te fai trattà così a pesci in faccia?\"</em>", tags: ["roman","idiom"] },
  { it: "fà il vago", en: "to play it vague / act casual", hint: "Fà il vago = to act vague and noncommittal, to pretend not to notice or care. Cercavo di fà il vago e scrollavo il telefono con disinvoltura", context: "<em>\"Cercavo di fà il vago e scrollavo il telefono con disinvoltura.\"</em>", tags: ["roman","idiom"] },
  { it: "con disinvoltura", en: "casually / with ease / nonchalantly", hint: "Disinvolto = uninhibited, at ease. Scrollavo il telefono con disinvoltura = I was scrolling nonchalantly. The performance of casual indifference", context: "<em>\"Cercavo di fà il vago e scrollavo il telefono con disinvoltura.\"</em>", tags: [] },
  { it: "un silos pieno di gesuiti", en: "a silo full of Jesuits", hint: "Sei falso — ma manco come un gesuita, come un silos pieno di gesuiti. The Jesuits' reputation for strategic deception, amplified to industrial scale", context: "<em>\"Sei falso. Ma manco come un gesuita, come un silos pieno di gesuiti.\"</em>", tags: ["roman","idiom"] },
  { it: "avé la fila", en: "to have a line / be in demand", hint: "C'ho la fila = I have a line of people waiting. Used boastfully or sarcastically: Non me devo mette a pregà. Guarda che c'ho la fila", context: "<em>\"Insomma, ci ospiti o no? Guarda che c'ho la fila. Non me devo mette a pregà.\"</em>", tags: ["roman","idiom"] },
  { it: "l'ultima notte da uomo libero", en: "the last night as a free man", hint: "Borrowed from bachelor party language — Zero treats hosting Smeralda as the end of his freedom, so he wants his final night alone", context: "<em>\"Però da domani, te prego. Stasera famme fà l'ultima notte da uomo libero.\"</em>", tags: ["idiom"] },
  { it: "tramandare due spicci di valori", en: "to pass down a few cents' worth of values", hint: "Two spicci of values = the bare minimum moral compass. Due spicci = two cents/pennies. The title of the show used as a phrase: passing down a tiny bit of human decency", context: "<em>\"Tutti quelli che t'hanno provato a tramandà due spicci di valori te sputerebbero in faccia.\"</em>", tags: ["roman","idiom"] },
  { it: "una scatto di carriera", en: "a career move / step up", hint: "Scatto = leap/jump. Used ironically: Paturnia moved to Tor Sta Ceppa 'per uno scatto di carriera' — as if criminal promotion is like getting a promotion at an office", context: "<em>\"Si è trasferito a Tor Sta Ceppa, per uno scatto di carriera.\"</em>", tags: ["idiom","noun"] },
  { it: "ti pesto come l'uva", en: "I'll crush you like grapes", hint: "The bully's classic threat — I'll stomp you like grapes in a wine press. Paturnia's signature line from the old days", context: "<em>\"Ti pesto come l'uva e lo sai perché? Perché posso!\"</em>", tags: ["roman","idiom"] },
  { it: "fare pippa", en: "to do nothing / to be useless", hint: "Fare pippa = to piss = to be useless, to fail to act. E tutti facevamo pippa = and we all just stood there doing nothing. Very Roman colloquial", context: "<em>\"E tutti facevamo pippa perché negli anni '80 il massimo luminare della psicologia era Charles Darwin.\"</em>", tags: ["roman","slang","idiom"] },

  // === EP2 DEEP MINE ===
